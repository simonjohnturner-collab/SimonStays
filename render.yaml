# Render blueprint for SimonStays (StaySync).
# Creates: a Postgres DB, the Node backend, and the React static front-end.
databases:
  - name: staysync-db
    databaseName: staysync
    plan: free

services:
  # ---- Backend API (Node + Express + Prisma) ----
  - type: web
    name: staysync-api
    runtime: node
    plan: free
    rootDir: server
    buildCommand: npm install && npm run build   # install + prisma generate + db push
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: staysync-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: SYNC_CRON
        value: "*/30 * * * *"
      - key: ZOHO_POLL_CRON
        value: "*/5 * * * *"
      - key: ZOHO_IMAP_HOST
        value: imap.zoho.com
      - key: ZOHO_IMAP_FOLDER
        value: Inbox/Airbnb
      # Secrets — set these in the Render dashboard (sync:false = not in git):
      - key: ZOHO_IMAP_USER
        sync: false
      - key: ZOHO_IMAP_PASSWORD
        sync: false
      - key: ZOHO_IMAP_HOST_EMAIL
        sync: false

  # ---- Front-end (Vite React static site) ----
  - type: web
    name: staysync-web
    runtime: static
    rootDir: web
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      # Set to the backend URL after it deploys, e.g. https://staysync-api.onrender.com
      - key: VITE_API_BASE
        sync: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
