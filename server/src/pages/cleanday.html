<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Your cleans · SimonStays</title>
<style>
  :root { --green:#1a7a3a; --green-d:#14622f; --ink:#1f2430; --muted:#6b7280; --line:#e3e6ea; --bg:#f4f6f4; }
  * { box-sizing:border-box; }
  html,body { margin:0; }
  body { font-family:-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif; color:var(--ink); background:var(--bg); line-height:1.5; }
  .wrap { max-width:520px; margin:0 auto; padding:16px; }
  .brand { font-size:22px; font-weight:800; color:var(--green); margin-bottom:12px; }
  .brand span { color:var(--ink); }
  h1 { font-size:20px; margin:0 0 12px; }
  .muted { color:var(--muted); font-size:14px; }
  a.job { display:grid; grid-template-columns:60px 1fr; gap:10px; background:#fff; border:1px solid var(--line); border-radius:12px; padding:14px; margin-bottom:10px; color:var(--ink); text-decoration:none; }
  a.job:active { background:#f6f6f6; }
  .time { font-size:18px; font-weight:800; }
  .place { font-weight:700; }
  .kind { display:inline-block; font-size:12px; font-weight:700; border-radius:999px; padding:1px 8px; background:#e6f0fa; color:#24507a; margin:2px 0; }
  .kind.instay { background:#fbf0dc; color:#7a5212; }
  .on { color:var(--green); font-weight:700; font-size:14px; }
  .go { color:var(--green); font-weight:700; font-size:14px; }
</style>
</head>
<body>
<main class="wrap">
  <div class="brand">Simon<span>Stays</span></div>
  <div id="app"><p class="muted">Loading…</p></div>
</main>
<script>
(function(){
  var api = '/public/cleaning/day/' + encodeURIComponent(location.pathname.split('/').pop());
  var app = document.getElementById('app');
  function el(tag, cls, text){ var e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; }
  function day(d){ return new Date(d + 'T12:00:00Z').toLocaleDateString('en-ZA', { weekday:'long', day:'numeric', month:'long', timeZone:'UTC' }); }
  function hm(t){ return new Date(t).toLocaleTimeString('en-ZA', { hour:'2-digit', minute:'2-digit', timeZone:'Africa/Johannesburg' }); }
  fetch(api).then(function(r){ return r.json().then(function(d){ if (!r.ok) throw new Error(d.message); return d; }); }).then(function(d){
    app.textContent = '';
    app.appendChild(el('h1', null, (d.date === d.today ? 'Your cleans today, ' : 'Your cleans, ') + day(d.date)));
    if (!d.jobs.length) app.appendChild(el('p', 'muted', 'You have no cleans this day.'));
    d.jobs.forEach(function(j){
      var a = el('a', 'job'); a.href = j.link;
      a.appendChild(el('div', 'time', (j.seq ? j.seq + '. ' : '') + j.time));
      var m = el('div');
      m.appendChild(el('div', 'place', j.place));
      m.appendChild(el('span', 'kind ' + j.kind, j.label));
      if (j.guestName) m.appendChild(el('div', 'muted', 'Guest: ' + j.guestName));
      (j.notes || []).forEach(function(n){ m.appendChild(el('div', 'muted', '📋 ' + n)); });
      m.appendChild(j.reportDone ? el('div', 'on', '✓ Report sent') : j.arrivedAt ? el('div', 'on', '✓ Arrived ' + hm(j.arrivedAt)) : el('div', 'go', 'Tap when you arrive →'));
      a.appendChild(m); app.appendChild(a);
    });
  }).catch(function(e){ app.textContent = ''; app.appendChild(el('h1', null, 'This link isn’t valid')); app.appendChild(el('p', 'muted', e.message || '')); });
})();
</script>
</body>
</html>
