<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%232563eb'/%3E%3Ctext x='16' y='23' font-family='Arial,Helvetica,sans-serif' font-size='22' font-weight='700' fill='white' text-anchor='middle'%3ES%3C/text%3E%3C/svg%3E">
<title>Checkout clean report · SimonStays</title>
<style>
  :root { --green:#1a7a3a; --green-d:#14622f; --ink:#1f2430; --muted:#6b7280; --line:#e3e6ea; --bg:#f4f6f4; --red:#cc2b2b; }
  * { box-sizing:border-box; }
  html,body { margin:0; }
  body { font-family:-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif; color:var(--ink); background:var(--bg); line-height:1.5; }
  .top { background:var(--green); color:#fff; padding:18px 16px; }
  .brand { font-weight:800; font-size:20px; letter-spacing:-.3px; }
  .brand span { color:#bfe6cd; }
  .top p { margin:4px 0 0; font-size:13px; opacity:.92; }
  .wrap { max-width:600px; margin:0 auto; padding:16px 14px 70px; }
  .q { background:#fff; border:1px solid var(--line); border-radius:12px; padding:12px 14px; margin-top:10px; }
  .q > label, .field-label { display:block; font-size:14px; font-weight:600; margin-bottom:8px; }
  .req::after { content:" *"; color:var(--red); }
  input,select,textarea { width:100%; font:inherit; font-size:16px; padding:11px 12px; border:1px solid var(--line); border-radius:10px; background:#fff; }
  input:focus,select:focus,textarea:focus { outline:none; border-color:var(--green); }
  textarea { resize:vertical; min-height:70px; }
  .yesno { display:flex; gap:10px; }
  .yesno button { flex:1; padding:12px; border:1.5px solid var(--line); border-radius:10px; background:#fff; color:var(--ink); font-size:15px; font-weight:600; cursor:pointer; }
  .yesno button.yes.on { background:var(--green); border-color:var(--green); color:#fff; }
  .yesno button.no.on { background:var(--red); border-color:var(--red); color:#fff; }
  .photos { display:flex; flex-wrap:wrap; gap:8px; margin-bottom:8px; }
  .thumb { position:relative; width:80px; height:80px; border-radius:9px; overflow:hidden; border:1px solid var(--line); }
  .thumb img { width:100%; height:100%; object-fit:cover; display:block; }
  .thumb button { position:absolute; top:2px; right:2px; width:20px; height:20px; border-radius:50%; border:0; background:rgba(0,0,0,.6); color:#fff; font-size:12px; line-height:1; cursor:pointer; }
  .photo-btns { display:flex; }
  .pbtn { flex:1; text-align:center; padding:11px; border:1px solid var(--line); border-radius:10px; background:#fff; color:var(--ink); font-size:14px; font-weight:600; cursor:pointer; }
  .pbtn:hover { border-color:var(--green); color:var(--green); }
  .pbtn input { display:none; }
  .photo-warn { margin-top:8px; padding:9px 11px; border:1px solid #f2c7c7; background:#fdeeee; color:#8a1f1f; border-radius:10px; font-size:13px; line-height:1.35; }
  .photo-warn .anyway { display:block; margin-top:7px; padding:0; background:none; border:0; color:#6b7280; font-size:12px; text-decoration:underline; cursor:pointer; }
  .photo-checking { margin-top:8px; font-size:12px; color:var(--muted, #6b7280); }
  .live-pay { margin-top:12px; padding:12px 14px; border:1px solid var(--green); background:#f2faf5; border-radius:12px; }
  .live-pay .lp-title { font-weight:800; color:var(--green-d, #14622f); margin-bottom:6px; }
  .live-pay .lp-line { display:flex; justify-content:space-between; gap:10px; font-size:13px; color:#374151; padding:2px 0; }
  .live-pay .lp-muted { font-size:12px; color:#6b7280; padding:2px 0; }
  .live-pay .lp-row { display:flex; justify-content:space-between; gap:10px; padding:3px 0; border-top:1px solid #dcefe3; margin-top:4px; }
  .live-pay .lp-total { display:flex; justify-content:space-between; gap:10px; padding-top:6px; margin-top:4px; border-top:2px solid var(--green); font-weight:800; font-size:16px; color:var(--green-d, #14622f); }
  .live-pay .lp-fine { font-size:11px; color:#6b7280; margin-top:6px; }
  .room-tag { display:inline-block; font-size:11px; font-weight:700; color:var(--green-d); background:#e6f2ea; padding:1px 7px; border-radius:5px; margin-right:6px; text-transform:uppercase; letter-spacing:.3px; }
  .form-section { background:#fff; border:1px solid var(--line); border-radius:12px; margin-top:12px; overflow:hidden; box-shadow:0 1px 2px rgba(0,0,0,.04); }
  .form-section > summary { list-style:none; cursor:pointer; padding:13px 16px; font-weight:700; font-size:15px; color:var(--green-d); background:#eef6f0; }
  .form-section > summary::-webkit-details-marker { display:none; }
  .form-section > summary::after { content:'\25be'; float:right; color:var(--muted); }
  .form-section[open] > summary::after { content:'\25b4'; }
  .section-body { padding:2px 14px 12px; }
  .section-body .q { border:0; background:transparent; padding:12px 0; margin:0; border-bottom:1px solid #eef0ee; border-radius:0; }
  .section-body .q:last-child { border-bottom:0; }
  .section-intro { color:var(--muted); font-size:13px; margin:2px 0 8px; }
  .form-section > summary .pill { float:right; margin-left:8px; font-size:11px; font-weight:700; padding:2px 8px; border-radius:20px; text-transform:uppercase; letter-spacing:.3px; }
  .form-section > summary::after { margin-left:8px; }
  .pill.todo { background:#eceef0; color:#6b7280; }
  .pill.part { background:#fff4e0; color:#a15c00; }
  .pill.done { background:#e6f2ea; color:var(--green-d); }
  .pill.opt { background:#eef2f7; color:#586274; }
  /* Standout sections: purchases (accent) and damaged items (warn). */
  .form-section.accent { border-color:#f0d9ad; }
  .form-section.accent > summary { background:#fff4e0; color:#8a5200; }
  .form-section.warn { border-color:#f2c7c2; }
  .form-section.warn > summary { background:#fdecea; color:#b3261e; }
  .od-item { border:1px dashed #d8b48a; border-radius:10px; padding:8px 12px 4px; margin:10px 0; background:#fffaf2; }
  .form-section.warn .od-item { border-color:#e6b3ab; background:#fff6f5; }
  .od-item-head { display:flex; justify-content:space-between; align-items:center; margin-bottom:2px; }
  .od-item-head strong { font-size:13px; }
  .od-rm { background:none; border:0; color:var(--muted); font-size:13px; cursor:pointer; text-decoration:underline; padding:0; }
  .od-rm:hover { color:var(--red); }
  .od-add { width:100%; margin:8px 0 2px; padding:11px; background:#eafaf0; color:var(--green-d); border:1px solid #cdeede; border-radius:10px; font-weight:700; font-size:14px; cursor:pointer; }
  .od-add:hover { background:#dff5e8; }
  .form-section.warn .od-add { background:#fdeceb; color:#b3261e; border-color:#f2c7c2; }
  .od-empty { font-size:13px; color:var(--muted); margin:4px 0 2px; }
  .sec-foot { display:flex; align-items:center; gap:10px; padding:4px 0 6px; }
  .sec-save { padding:9px 16px; border:1.5px solid var(--green); border-radius:10px; background:#fff; color:var(--green-d); font-size:14px; font-weight:700; cursor:pointer; }
  .sec-save:hover { background:var(--green); color:#fff; }
  .sec-note { font-size:12px; color:var(--muted); }
  .draftbar { position:sticky; top:0; z-index:5; display:flex; align-items:center; gap:10px; background:#eef6f0; border:1px solid #d6e6db; border-radius:10px; padding:8px 12px; margin-top:12px; }
  .draftbar .dnote { flex:1; font-size:13px; color:var(--green-d); }
  .draftbar button { padding:9px 14px; border:1.5px solid var(--green); border-radius:10px; background:#fff; color:var(--green-d); font-size:13px; font-weight:700; cursor:pointer; }
  .submit { width:100%; margin-top:20px; padding:15px; background:var(--green); color:#fff; border:0; border-radius:12px; font-weight:700; font-size:16px; cursor:pointer; }
  .submit:disabled { opacity:.6; }
  .msg { margin-top:14px; font-size:14px; padding:10px 12px; border-radius:10px; }
  .msg.err { background:#fdeaea; color:#a11; }
  .msg.info { background:#eef6f0; color:var(--green-d); }
  .done { background:#fff; border:1px solid var(--line); border-radius:14px; padding:28px 20px; text-align:center; margin-top:20px; }
  .done .tick { font-size:46px; } .done h2 { margin:8px 0 6px; } .done p { color:var(--muted); margin:0 0 18px; }
  .hidden { display:none; }
</style>
</head>
<body>
  <div class="top">
    <div class="brand">Simon<span>Stays</span></div>
    <p id="subtitle">Checkout clean report</p>
  </div>

  <div class="wrap">
    <form id="form">
      <div class="q"><label class="req" for="cleaner">Name of cleaner</label>
        <select id="cleaner" required><option value="">Select your name…</option></select>
        <input type="text" id="cleaner-other" placeholder="Type your name" style="display:none;margin-top:8px"></div>

      <div class="q"><label for="date">Date</label>
        <input type="date" id="date"></div>

      <div class="q"><label class="req" for="prop">Property</label>
        <select id="prop" required><option value="">Loading…</option></select></div>

      <div class="q"><label class="req" for="unit">Unit</label>
        <select id="unit" required><option value="">Select a property first</option></select></div>

      <p class="section-intro" id="intro"></p>

      <div class="draftbar hidden" id="draftbar">
        <span class="dnote" id="dnote">Your progress saves automatically on this phone.</span>
        <button type="button" id="saveall">Save &amp; finish later</button>
      </div>

      <div id="fields"></div>

      <div id="msg"></div>
      <button type="submit" class="submit" id="submit">Submit clean report</button>
    </form>

    <div id="done" class="done hidden">
      <div class="tick">✅</div>
      <h2>Thank you</h2>
      <p>Your checkout clean report has been submitted.</p>
      <button class="submit" onclick="location.reload()">Submit another</button>
    </div>
  </div>

<script>
  var PROPS = [], TEMPLATE = null, UNIT = null;
  var answers = {}, photoFiles = {}, rendered = [], SUBID = null;
  // Save-as-you-go state. SECTIONS describes each collapsible section (for the
  // completeness pills and the "sections still to complete" prompt at submit).
  // SETTERS/photoData/photoRedraw let a saved draft be restored into the form.
  var SECTIONS = [], SETTERS = {}, photoData = {}, photoRedraw = {};
  var restoring = false, saveTimer = null;
  // Live purchases summary (what the cleaner is owed) as she uploads invoices.
  var RATE_CENTS = null;        // the selected property's per-clean fee
  var INVOICE_LIVEBOX = null;   // the card element under the invoice photo field
  var INVOICE_FIELD_ID = null;  // the buy_invoice field's id (set when it renders)

  function el(tag, cls, text) { var e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; }
  function rand(c) { return (c == null) ? '—' : 'R' + (Number(c) / 100).toFixed(2); }
  function esc(s) { return String(s).replace(/[&<>]/g, function (m) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;' }[m]; }); }
  function hashStr(s) { var h = 5381, i = s.length; while (i) { h = (h * 33) ^ s.charCodeAt(--i); } return (h >>> 0).toString(36) + ':' + s.length; }

  // Build the cleaner's live "what you'll be paid today" card from the invoices
  // she's added so far: each analysed receipt + total, her cleaning fee, and the
  // sum. Duplicate invoice numbers are ignored so nothing is counted twice.
  function renderLiveSummary() {
    var box = INVOICE_LIVEBOX; if (!box) return;
    var files = (INVOICE_FIELD_ID && photoFiles[INVOICE_FIELD_ID]) || [];
    var anyLoading = false, anyErr = false, all = [];
    files.forEach(function (fl) {
      if (fl._invLoading) anyLoading = true;
      if (fl._invErr) anyErr = true;
      (fl._invReceipts || []).forEach(function (rc) { all.push(rc); });
    });
    var seen = {}, kept = [], dupCount = 0;
    all.forEach(function (rc) {
      var key = rc.invoiceNumber ? String(rc.invoiceNumber).toLowerCase() : null;
      if (key && seen[key]) { dupCount++; return; }
      if (key) seen[key] = true;
      kept.push(rc);
    });
    if (!files.length && RATE_CENTS == null) { box.style.display = 'none'; return; }
    var spent = 0; kept.forEach(function (rc) { if (typeof rc.totalCents === 'number') spent += rc.totalCents; });
    var owed = spent + (RATE_CENTS || 0);

    var html = '<div class="lp-title">💰 What you’ll be paid today</div>';
    kept.forEach(function (rc, i) {
      var head = 'Receipt ' + (i + 1) + (rc.merchant ? ' · ' + esc(rc.merchant) : '') + (rc.invoiceNumber ? ' · #' + esc(rc.invoiceNumber) : '');
      html += '<div class="lp-line"><span>' + head + '</span><span>' + rand(rc.totalCents) + '</span></div>';
    });
    if (anyLoading) html += '<div class="lp-muted">Reading your latest invoice…</div>';
    if (dupCount) html += '<div class="lp-muted">' + dupCount + ' duplicate invoice' + (dupCount > 1 ? 's' : '') + ' ignored.</div>';
    if (anyErr && !kept.length) html += '<div class="lp-muted">Couldn’t read that invoice clearly — you can still submit; the host will total it.</div>';
    html += '<div class="lp-row"><span>Purchases</span><span>' + rand(spent) + '</span></div>';
    if (RATE_CENTS != null) html += '<div class="lp-row"><span>Your cleaning fee</span><span>' + rand(RATE_CENTS) + '</span></div>';
    html += '<div class="lp-total"><span>You’ll be paid</span><span>' + rand(owed) + '</span></div>';
    html += '<div class="lp-fine">Estimated from your invoices — the host confirms the final amount.</div>';
    box.innerHTML = html; box.style.display = 'block';
  }

  // ---- Draft (save-as-you-go) helpers -------------------------------------
  function draftKey(unitId) { return 'ss_clean_draft_v1_' + unitId; }
  function dataURLtoFile(dataURL, name, type) {
    try {
      var comma = dataURL.indexOf(','); var bstr = atob(dataURL.slice(comma + 1));
      var n = bstr.length, u8 = new Uint8Array(n); while (n--) u8[n] = bstr.charCodeAt(n);
      return new File([u8], name || 'photo.jpg', { type: type || 'image/jpeg' });
    } catch (e) { return null; }
  }
  // Persist the current answers to this phone. Photos are large, so if the
  // browser's storage is full we save the answers without them rather than fail.
  function doSave() {
    if (restoring || !TEMPLATE || !UNIT) return;
    var draft = {
      cleaner: document.getElementById('cleaner').value,
      cleanerOther: document.getElementById('cleaner-other').value,
      propId: document.getElementById('prop').value,
      date: document.getElementById('date').value,
      answers: answers, photos: photoData, ondemand: ondemandState(), ts: Date.now()
    };
    var key = draftKey(UNIT.id);
    try { localStorage.setItem(key, JSON.stringify(draft)); }
    catch (e) {
      try { var lite = Object.assign({}, draft, { photos: {}, photosDropped: true }); localStorage.setItem(key, JSON.stringify(lite)); }
      catch (e2) { return; }
    }
    flashSaved();
  }
  function scheduleSave() { if (saveTimer) clearTimeout(saveTimer); saveTimer = setTimeout(doSave, 400); }
  function clearDraft() { try { if (UNIT) localStorage.removeItem(draftKey(UNIT.id)); } catch (e) {} }
  function flashSaved() {
    var n = document.getElementById('dnote'); if (!n) return;
    n.textContent = 'Progress saved on this phone ✓';
    clearTimeout(flashSaved._t); flashSaved._t = setTimeout(function () { n.textContent = 'Your progress saves automatically on this phone.'; }, 2500);
  }
  // Read the original file bytes as a data URL — the reliable fallback that
  // works even in webviews (WhatsApp/Gmail in‑app browsers) where canvas is blocked.
  function readRaw(file) {
    return new Promise(function (resolve) {
      var r = new FileReader();
      r.onload = function () { resolve({ dataBase64: r.result, contentType: file.type || 'image/jpeg' }); };
      r.onerror = function () { resolve(null); };
      r.readAsDataURL(file);
    });
  }
  // Try to shrink + re-encode to JPEG via canvas; fall back to the original bytes
  // if the browser can't decode it (e.g. HEIC) or the canvas comes back empty
  // (mobile memory limits / in‑app browsers). Never rejects — returns null only
  // if even the raw read fails, so a photo is never silently dropped.
  function prep(file, maxDim, quality) {
    return new Promise(function (resolve) {
      var done = false, img = new Image(), url = URL.createObjectURL(file);
      var fallback = function () { if (done) return; done = true; try { URL.revokeObjectURL(url); } catch (e) {} readRaw(file).then(resolve); };
      img.onload = function () {
        try {
          URL.revokeObjectURL(url);
          var w = img.width, h = img.height; if (!w || !h) return fallback();
          if (Math.max(w, h) > maxDim) { var s = maxDim / Math.max(w, h); w = Math.round(w * s); h = Math.round(h * s); }
          var c = document.createElement('canvas'); c.width = w; c.height = h; c.getContext('2d').drawImage(img, 0, 0, w, h);
          var out = c.toDataURL('image/jpeg', quality);
          if (!out || out.length < 100) return fallback();
          done = true; resolve({ dataBase64: out, contentType: 'image/jpeg' });
        } catch (e) { fallback(); }
      };
      img.onerror = fallback; img.src = url;
    });
  }

  // Rough on-phone legibility check so a cleaner can't submit a photo too blurry,
  // dark or tiny to read — we tell them there and then to retake it. Deliberately
  // lenient (cleaners have cheap phones) and FAIL-OPEN: if the browser can't decode
  // or measure the image (some in-app webviews taint the canvas), we allow it
  // rather than wrongly block. `strict` (invoices) demands a bit more sharpness.
  var BLUR_MIN = 42, BLUR_MIN_STRICT = 85, MIN_SIDE = 480, DARK_MAX = 38, BRIGHT_MAX = 249;
  function assessPhoto(file, strict) {
    return new Promise(function (resolve) {
      var img = new Image(), url = URL.createObjectURL(file), done = false;
      var allow = function () { if (done) return; done = true; try { URL.revokeObjectURL(url); } catch (e) {} resolve({ ok: true }); };
      var fail = function (reason) { if (done) return; done = true; try { URL.revokeObjectURL(url); } catch (e) {} resolve({ ok: false, reason: reason }); };
      img.onerror = allow;
      img.onload = function () {
        try {
          var ow = img.width, oh = img.height;
          if (!ow || !oh) return allow();
          if (Math.min(ow, oh) < MIN_SIDE) return fail('too small or low‑resolution');
          var maxD = 500, sc = Math.min(1, maxD / Math.max(ow, oh));
          var w = Math.max(1, Math.round(ow * sc)), h = Math.max(1, Math.round(oh * sc));
          var c = document.createElement('canvas'); c.width = w; c.height = h;
          var ctx = c.getContext('2d'); ctx.drawImage(img, 0, 0, w, h);
          var data; try { data = ctx.getImageData(0, 0, w, h).data; } catch (e) { return allow(); }
          var n = w * h, gray = new Float32Array(n), sum = 0;
          for (var i = 0, p = 0; i < n; i++, p += 4) { var g = 0.299 * data[p] + 0.587 * data[p + 1] + 0.114 * data[p + 2]; gray[i] = g; sum += g; }
          var mean = sum / n;
          if (mean < DARK_MAX) return fail('too dark');
          if (mean > BRIGHT_MAX) return fail('too bright or washed out');
          // Variance of the Laplacian — a standard focus/sharpness measure.
          var ls = 0, lsq = 0, cnt = 0;
          for (var y = 1; y < h - 1; y++) for (var x = 1; x < w - 1; x++) {
            var o = y * w + x, lap = 4 * gray[o] - gray[o - 1] - gray[o + 1] - gray[o - w] - gray[o + w];
            ls += lap; lsq += lap * lap; cnt++;
          }
          var lvar = cnt ? (lsq / cnt) - (ls / cnt) * (ls / cnt) : 0;
          if (lvar < (strict ? BLUR_MIN_STRICT : BLUR_MIN)) return fail('too blurry');
          return resolve({ ok: true });
        } catch (e) { allow(); }
      };
      img.src = url;
    });
  }

  function renderField(f) {
    var q = el('div', 'q');
    var lbl = el('div', 'field-label' + (f.required ? ' req' : ''));
    if (f.roomTag) { var rt = el('span', 'room-tag', f.roomTag); lbl.appendChild(rt); lbl.appendChild(document.createTextNode(f.label)); }
    else lbl.textContent = f.label;
    q.appendChild(lbl);

    if (f.type === 'checkbox') {
      var yn = el('div', 'yesno'); var yes = el('button', 'yes', 'Yes'); yes.type = 'button'; var no = el('button', 'no', 'No'); no.type = 'button';
      function pick(v) { answers[f.id] = v; yes.classList.toggle('on', v === true); no.classList.toggle('on', v === false); }
      yes.onclick = function () { pick(true); afterChange(); };
      no.onclick = function () { pick(false); afterChange(); };
      yn.appendChild(yes); yn.appendChild(no); q.appendChild(yn);
      SETTERS[f.id] = function (v) { if (v === true || v === false) pick(v); };
    } else if (f.type === 'textarea') {
      var ta = el('textarea'); ta.placeholder = 'Type here…'; ta.oninput = function () { answers[f.id] = ta.value; }; q.appendChild(ta);
      SETTERS[f.id] = function (v) { ta.value = v == null ? '' : v; answers[f.id] = ta.value; };
    } else if (f.type === 'number' || f.type === 'rating') {
      var num = el('input'); num.type = 'number'; if (f.type === 'rating') { num.min = 1; num.max = 5; } num.oninput = function () { answers[f.id] = num.value; }; q.appendChild(num);
      SETTERS[f.id] = function (v) { num.value = v == null ? '' : v; answers[f.id] = num.value; };
    } else if (f.type === 'select') {
      var sel = el('select'); var o0 = el('option', null, ''); o0.value = ''; sel.appendChild(o0);
      (f.options || []).forEach(function (o) { var op = el('option', null, o); op.value = o; sel.appendChild(op); });
      sel.onchange = function () { answers[f.id] = sel.value; }; q.appendChild(sel);
      SETTERS[f.id] = function (v) { sel.value = v == null ? '' : v; answers[f.id] = sel.value; };
    } else if (f.type === 'date') {
      var dt = el('input'); dt.type = 'date'; dt.oninput = function () { answers[f.id] = dt.value; }; q.appendChild(dt);
      SETTERS[f.id] = function (v) { dt.value = v == null ? '' : v; answers[f.id] = dt.value; };
    } else if (f.type === 'photos') {
      photoFiles[f.id] = photoFiles[f.id] || []; photoData[f.id] = photoData[f.id] || [];
      var photos = el('div', 'photos');
      function draw() { photos.innerHTML = ''; photoFiles[f.id].forEach(function (file, i) {
        var t = el('div', 'thumb'); var im = el('img'); im.src = URL.createObjectURL(file); t.appendChild(im);
        var x = el('button', null, '×'); x.type = 'button'; x.onclick = function () { photoFiles[f.id].splice(i, 1); photoData[f.id].splice(i, 1); draw(); afterChange(); if (f.id === INVOICE_FIELD_ID) renderLiveSummary(); }; t.appendChild(x); photos.appendChild(t); }); }
      photoRedraw[f.id] = draw;
      q.appendChild(photos);
      var btns = el('div', 'photo-btns'); var l = el('label', 'pbtn', '📷 Add photos'); var inp = el('input'); inp.type = 'file'; inp.accept = 'image/*'; inp.multiple = true;
      var warn = el('div', 'photo-warn'); warn.style.display = 'none';
      var checking = el('div', 'photo-checking', 'Checking the photo is clear enough…'); checking.style.display = 'none';
      // Invoices must be readable enough to itemise, so they're checked more strictly.
      var strict = (f.id === 'buy_invoice' || String(f.id).indexOf('buy_invoice__') === 0);
      var fails = 0, lastRejected = null;
      function accept(file) {
        warn.style.display = 'none';
        photoFiles[f.id].push(file); var idx = photoFiles[f.id].length - 1;
        // Keep a compressed copy in the on-phone draft so progress survives a reload.
        prep(file, 1400, 0.75).then(function (p) { if (p && p.dataBase64 && photoFiles[f.id][idx] === file) { photoData[f.id][idx] = p.dataBase64; scheduleSave(); } });
        draw(); afterChange();
        if (strict) analyzeInvoiceFile(f.id, file);   // live "what you're owed" summary
      }
      function removeFile(file) {
        var arr = photoFiles[f.id] || []; var i = arr.indexOf(file);
        if (i >= 0) { arr.splice(i, 1); (photoData[f.id] || []).splice(i, 1); }
        draw(); afterChange();
      }
      function warnMsg(text) { warn.innerHTML = ''; warn.appendChild(el('div', null, text)); warn.style.display = 'block'; }
      function reject(file, reason) {
        fails++; lastRejected = file; warn.innerHTML = '';
        warn.appendChild(el('div', null, '⚠️ That photo looks ' + reason + ' — please take a clearer picture so it can be read.'));
        if (fails >= 2) {
          var a = el('button', 'anyway', 'Photo still not accepted after a few tries? Add it anyway'); a.type = 'button';
          a.onclick = function () { if (lastRejected) { var f2 = lastRejected; lastRejected = null; accept(f2); } };
          warn.appendChild(a);
        }
        warn.style.display = 'block';
      }
      inp.onchange = function (e) {
        var files = Array.prototype.slice.call(e.target.files); e.target.value = '';
        if (!files.length) return;
        checking.style.display = 'block';
        files.reduce(function (chain, file) {
          return chain.then(function () {
            return assessPhoto(file, strict).then(function (res) { if (res.ok) accept(file); else reject(file, res.reason); });
          });
        }, Promise.resolve()).then(function () { checking.style.display = 'none'; });
      };
      // Read a just-added invoice with the AI, dedup it, and refresh the live summary.
      function analyzeInvoiceFile(fid, file) {
        file._invLoading = true; renderLiveSummary();
        prep(file, 1600, 0.82).then(function (p) {
          if (!p || !p.dataBase64) { file._invLoading = false; renderLiveSummary(); return; }
          var h = hashStr(p.dataBase64);
          var dup = (photoFiles[fid] || []).some(function (o) { return o !== file && o._invHash === h; });
          if (dup) { removeFile(file); warnMsg('⚠️ That looks like an invoice you already added — it hasn’t been added again.'); renderLiveSummary(); return; }
          file._invHash = h;
          fetch('/public/forms/analyze-invoice', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ images: [{ dataBase64: p.dataBase64, contentType: p.contentType }] }) })
            .then(function (r) { return r.json(); })
            .then(function (res) {
              file._invLoading = false;
              if (res && res.ok && Array.isArray(res.receipts)) { file._invReceipts = res.receipts; file._invErr = false; }
              else { file._invReceipts = []; file._invErr = (res && res.reason) || 'failed'; }
              renderLiveSummary();
            })
            .catch(function () { file._invLoading = false; file._invReceipts = []; file._invErr = 'failed'; renderLiveSummary(); });
        });
      }
      l.appendChild(inp); btns.appendChild(l); q.appendChild(btns); q.appendChild(checking); q.appendChild(warn);
      if (strict) { INVOICE_FIELD_ID = f.id; INVOICE_LIVEBOX = el('div', 'live-pay'); INVOICE_LIVEBOX.style.display = 'none'; q.appendChild(INVOICE_LIVEBOX); renderLiveSummary(); }
      SETTERS[f.id] = function (list) {
        list = list || []; photoData[f.id] = list.slice();
        photoFiles[f.id] = list.map(function (d) { return dataURLtoFile(d); }).filter(Boolean);
        draw();
      };
    } else {
      var inp2 = el('input'); inp2.type = 'text'; inp2.oninput = function () { answers[f.id] = inp2.value; }; q.appendChild(inp2);
      SETTERS[f.id] = function (v) { inp2.value = v == null ? '' : v; answers[f.id] = inp2.value; };
    }
    return q;
  }

  // Re-run after any answer changes: refresh the section pills and save the draft.
  function afterChange() { refreshPills(); scheduleSave(); }

  // Replace tokens in a label:
  //   {sleeps}   → the unit's capacity (how many the place sleeps)
  //   {crockery} → 2 × bedrooms, i.e. how many of each item there should be
  //                (a 2-bed apartment → 4 beer glasses, wine glasses, bowls, etc.)
  function subst(s) {
    s = String(s == null ? '' : s);
    var cap = UNIT && UNIT.capacity != null ? UNIT.capacity : '';
    var crockery = 2 * Math.max(1, Number(UNIT && UNIT.bedrooms) || 1);
    return s.replace(/\{sleeps\}/g, cap).replace(/\{crockery\}/g, crockery);
  }

  // Build a section shell (collapsible card + completeness pill) and append it.
  function makeSection(name, variant) {
    var det = document.createElement('details'); det.className = 'form-section' + (variant ? ' ' + variant : ''); det.open = true;
    var sum = document.createElement('summary'); sum.appendChild(document.createTextNode(name));
    var pill = el('span', 'pill todo', 'Not started'); sum.appendChild(pill);
    det.appendChild(sum);
    var body = el('div', 'section-body'); det.appendChild(body);
    document.getElementById('fields').appendChild(det);
    return { name: name, fieldIds: [], det: det, pill: pill, note: null, body: body, mode: null, instances: [], nextN: 1, key: null };
  }
  function addSectionFooter(sec) {
    var foot = el('div', 'sec-foot');
    var save = el('button', 'sec-save', 'Save section'); save.type = 'button';
    var note = el('span', 'sec-note', '');
    save.onclick = function () { doSave(); refreshPills(); };
    foot.appendChild(save); foot.appendChild(note); sec.body.appendChild(foot);
    sec.note = note;
  }
  // Render one field into a section/container; forceReq makes it required regardless
  // of the template (used for each added damaged item — a photo + description).
  function addField(sec, container, f, suffix, forceReq) {
    var field = { id: f.id + suffix, label: subst(f.label), type: f.type, required: forceReq || f.required, options: f.options };
    rendered.push(field); sec.fieldIds.push(field.id); container.appendChild(renderField(field));
    return field;
  }

  function renderFields() {
    var host = document.getElementById('fields'); host.innerHTML = '';
    answers = {}; photoFiles = {}; rendered = []; SECTIONS = []; SETTERS = {}; photoData = {}; photoRedraw = {};
    // Group fields into sections (a 'section' field starts a new group).
    var groups = [], cur = { section: null, fields: [] };
    (TEMPLATE.fields || []).forEach(function (f) {
      if (f.type === 'section') { if (cur.section || cur.fields.length) groups.push(cur); cur = { section: f, fields: [] }; }
      else cur.fields.push(f);
    });
    if (cur.section || cur.fields.length) groups.push(cur);

    groups.forEach(function (g) {
      if (!g.fields.length) return;
      var variant = g.section && g.section.variant;
      var mode = g.section && g.section.repeat;

      // On-demand section: the cleaner taps "Add …" to log one or more items,
      // each a fresh copy of this group's fields (e.g. a photo + description).
      if (mode === 'ondemand') {
        var name = g.section.label || 'Items';
        var sec = makeSection(name, variant); sec.mode = 'ondemand'; sec.key = g.section.id || g.section.label;
        var items = el('div'); sec.body.appendChild(items);
        var empty = el('p', 'od-empty', 'None added yet.'); sec.body.appendChild(empty);
        sec.addInstance = function (n) {
          n = n || sec.nextN; if (n >= sec.nextN) sec.nextN = n + 1;
          var card = el('div', 'od-item');
          var head = el('div', 'od-item-head');
          head.appendChild(el('strong', null, name.replace(/s$/, '') + ' ' + n));
          var rm = el('button', 'od-rm', 'Remove'); rm.type = 'button'; head.appendChild(rm);
          card.appendChild(head);
          var inst = { n: n, fieldIds: [], card: card };
          g.fields.forEach(function (f) { inst.fieldIds.push(addField(sec, card, f, '__' + n, true).id); });
          rm.onclick = function () {
            inst.fieldIds.forEach(function (id) {
              delete answers[id]; delete photoFiles[id]; delete photoData[id]; delete SETTERS[id]; delete photoRedraw[id];
              var k = sec.fieldIds.indexOf(id); if (k >= 0) sec.fieldIds.splice(k, 1);
              for (var i = rendered.length - 1; i >= 0; i--) if (rendered[i].id === id) rendered.splice(i, 1);
            });
            var ii = sec.instances.indexOf(inst); if (ii >= 0) sec.instances.splice(ii, 1);
            items.removeChild(card); empty.style.display = sec.instances.length ? 'none' : '';
            afterChange();
          };
          items.appendChild(card); sec.instances.push(inst); empty.style.display = 'none';
          return inst;
        };
        var add = el('button', 'od-add', (g.section.addLabel || 'Add item') + '  ＋'); add.type = 'button';
        add.onclick = function () { sec.addInstance(); afterChange(); };
        sec.body.appendChild(add);
        addSectionFooter(sec); SECTIONS.push(sec);
        return;
      }

      // Fixed section: shown once, or repeated per bedroom / bathroom.
      var rep = (mode === 'bedroom' || mode === 'bathroom') ? mode : null;
      var count = rep ? Math.max(1, Number(rep === 'bedroom' ? UNIT.bedrooms : UNIT.bathrooms) || 1) : 1;
      for (var inst2 = 1; inst2 <= count; inst2++) {
        (function (n) {
          var suffix = (rep && count > 1) ? ('__' + n) : '';
          var nm = g.section ? ((rep && count > 1) ? (g.section.label + ' ' + n) : g.section.label) : 'General checks';
          var s = makeSection(nm, variant);
          g.fields.forEach(function (f) { addField(s, s.body, f, suffix, false); });
          addSectionFooter(s); SECTIONS.push(s);
        })(inst2);
      }
    });
    refreshPills();
  }

  function fieldById(id) { for (var i = 0; i < rendered.length; i++) if (rendered[i].id === id) return rendered[i]; return null; }
  function isEmpty(f) {
    if (f.type === 'photos') return (photoFiles[f.id] || []).length === 0;
    var v = answers[f.id]; return v === undefined || v === null || v === '';
  }
  function sectionState(sec) {
    var reqTotal = 0, reqMissing = 0, answered = 0;
    sec.fieldIds.forEach(function (id) {
      var f = fieldById(id); if (!f) return;
      var empty = isEmpty(f);
      if (f.required) { reqTotal++; if (empty) reqMissing++; }
      if (!empty) answered++;
    });
    // No required fields (e.g. Purchases, or an empty Damaged-items list) never blocks.
    if (reqTotal === 0) return answered ? 'done' : 'opt';
    return reqMissing === 0 ? 'done' : (answered ? 'part' : 'todo');
  }
  function refreshPills() {
    SECTIONS.forEach(function (sec) {
      var st = sectionState(sec);
      sec.pill.className = 'pill ' + (st === 'opt' ? 'opt' : st);
      sec.pill.textContent = st === 'done' ? 'Complete ✓'
        : st === 'part' ? 'In progress'
        : st === 'opt' ? (sec.mode === 'ondemand' ? 'None to report' : 'Optional')
        : 'Not started';
      if (sec.note) sec.note.textContent = (st === 'todo' || st === 'part') ? 'Some required answers still needed.' : 'Nothing outstanding here.';
    });
  }
  // Only sections with a required answer still missing block submission.
  function incompleteSections() { return SECTIONS.filter(function (s) { var st = sectionState(s); return st === 'todo' || st === 'part'; }); }
  function ondemandState() {
    var o = {}; SECTIONS.forEach(function (s) { if (s.mode === 'ondemand') o[s.key] = s.instances.map(function (i) { return i.n; }); });
    return o;
  }

  // Re-fill the form from a saved draft on this phone (answers + compressed photos).
  function restoreDraft(unitId) {
    var raw; try { raw = localStorage.getItem(draftKey(unitId)); } catch (e) { raw = null; }
    if (!raw) { refreshPills(); return; }
    var d; try { d = JSON.parse(raw); } catch (e) { refreshPills(); return; }
    restoring = true;
    try {
      var cs = document.getElementById('cleaner');
      if (d.cleaner) { cs.value = d.cleaner; document.getElementById('cleaner-other').style.display = d.cleaner === '__other' ? 'block' : 'none'; }
      if (d.cleanerOther) document.getElementById('cleaner-other').value = d.cleanerOther;
      if (d.date) document.getElementById('date').value = d.date;
      // Recreate any on-demand items (damaged items) first, so their fields exist.
      var od = d.ondemand || {};
      SECTIONS.forEach(function (s) {
        if (s.mode === 'ondemand' && Array.isArray(od[s.key])) od[s.key].forEach(function (n) { s.addInstance(n); });
      });
      var a = d.answers || {};
      Object.keys(a).forEach(function (id) { if (SETTERS[id]) SETTERS[id](a[id]); else answers[id] = a[id]; });
      var ph = d.photos || {};
      Object.keys(ph).forEach(function (id) { if (SETTERS[id]) SETTERS[id](ph[id]); });
      var n = document.getElementById('dnote');
      if (n) n.textContent = d.photosDropped
        ? 'Answers restored — please re-add photos before submitting.'
        : 'Saved progress restored — carry on where you left off.';
    } catch (e) {}
    restoring = false;
    refreshPills();
  }

  function loadForm(unitId) {
    SUBID = null; // new unit → new submission
    document.getElementById('fields').innerHTML = '<p class="section-intro">Loading the form for this unit…</p>';
    fetch('/public/forms/clean-for-unit/' + unitId).then(function (r) { return r.json(); }).then(function (d) {
      TEMPLATE = d.template; UNIT = d.unit;
      document.getElementById('subtitle').textContent = TEMPLATE.title || 'Checkout clean report';
      document.getElementById('intro').textContent = TEMPLATE.description || '';
      renderFields();
      document.getElementById('draftbar').classList.remove('hidden');
      restoreDraft(unitId);
    }).catch(function () { document.getElementById('fields').innerHTML = '<p class="msg err">Could not load the form. Please reload.</p>'; });
  }

  fetch('/public/forms/units').then(function (r) { return r.json(); }).then(function (d) {
    PROPS = d.properties || [];
    var cSel = document.getElementById('cleaner');
    (d.cleaners || []).forEach(function (n) { var o = el('option', null, n); o.value = n; cSel.appendChild(o); });
    var other = el('option', null, 'Other (type name)'); other.value = '__other'; cSel.appendChild(other);
    cSel.onchange = function () { document.getElementById('cleaner-other').style.display = this.value === '__other' ? 'block' : 'none'; };
    var propSel = document.getElementById('prop'); propSel.innerHTML = '<option value="">Select a property…</option>';
    PROPS.forEach(function (p) { var o = el('option', null, p.name); o.value = p.id; propSel.appendChild(o); });
    propSel.onchange = function () {
      var p = PROPS.filter(function (x) { return x.id === propSel.value; })[0];
      RATE_CENTS = (p && typeof p.cleanRateCents === 'number') ? p.cleanRateCents : null;
      var unitSel = document.getElementById('unit'); unitSel.innerHTML = '<option value="">Select a unit…</option>';
      (p ? p.units : []).forEach(function (u) { var o = el('option', null, u.name); o.value = u.id; unitSel.appendChild(o); });
      document.getElementById('fields').innerHTML = ''; TEMPLATE = null;
      renderLiveSummary();
    };
    document.getElementById('unit').onchange = function () { if (this.value) loadForm(this.value); };
  }).catch(function () { document.getElementById('prop').innerHTML = '<option value="">Could not load</option>'; });

  document.getElementById('date').value = new Date().toISOString().slice(0, 10);
  function showErr(t) { var m = document.getElementById('msg'); m.className = 'msg err'; m.textContent = t; window.scrollTo(0, document.body.scrollHeight); }

  // Autosave: any typing/selection saves the draft (debounced) and updates pills.
  document.getElementById('form').addEventListener('input', function () { if (!restoring && TEMPLATE) afterChange(); });
  document.getElementById('form').addEventListener('change', function () { if (!restoring && TEMPLATE) afterChange(); });
  document.getElementById('saveall').onclick = function () {
    doSave(); refreshPills();
    var n = document.getElementById('dnote'); if (n) n.textContent = 'Saved. You can close this and finish later on this phone.';
  };

  document.getElementById('form').onsubmit = function (e) {
    e.preventDefault();
    document.getElementById('msg').textContent = '';
    var cSel = document.getElementById('cleaner');
    var cleaner = (cSel.value === '__other' ? document.getElementById('cleaner-other').value : cSel.value).trim();
    var unitId = document.getElementById('unit').value;
    if (!cleaner) return showErr('Please enter your name.');
    if (!document.getElementById('prop').value) return showErr('Please choose the property.');
    if (!unitId || !TEMPLATE) return showErr('Please choose the unit.');
    var inc = incompleteSections();
    if (inc.length) {
      inc.forEach(function (s) { if (s.det) s.det.open = true; });
      var names = inc.map(function (s) { return s.name; });
      return showErr(inc.length + ' section' + (inc.length > 1 ? 's' : '') + ' still to complete: ' + names.join(', ') + '.');
    }

    var btn = document.getElementById('submit'); btn.disabled = true; btn.textContent = 'Sending…';
    var body = { type: 'clean', unitId: unitId, submitterName: cleaner, templateId: TEMPLATE.id || null, answers: Object.assign({ date: document.getElementById('date').value }, answers) };

    // Create the submission once; reuse it on retry so re-uploaded photos add to it.
    var ensure = SUBID ? Promise.resolve(SUBID)
      : fetch('/public/forms', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) })
          .then(function (r) { return r.json(); })
          .then(function (res) { if (!res || !res.id) throw new Error('submit failed'); SUBID = res.id; return SUBID; });

    ensure.then(function (id) {
        var jobs = [];
        Object.keys(photoFiles).forEach(function (fid) { (photoFiles[fid] || []).forEach(function (file) {
          if (file._uploaded) return; // already sent on a previous attempt
          jobs.push(prep(file, 1600, 0.82).then(function (p) {
            if (!p || !p.dataBase64) return;
            return fetch('/public/forms/' + id + '/photos', { method: 'POST', headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ fieldId: fid, dataBase64: p.dataBase64, contentType: p.contentType, filename: file.name }) })
              .then(function (r) { if (r.ok) file._uploaded = true; }, function () {}); })); }); });
        return Promise.all(jobs).then(function () { return id; });
      })
      .then(function (id) {
        // Finalize: the server confirms the required room photos actually arrived.
        return fetch('/public/forms/' + id + '/finalize', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: '{}' })
          .then(function (r) { return r.json().then(function (d) { return { ok: r.ok, d: d }; }); });
      })
      .then(function (res) {
        if (!res.ok) {
          var miss = (res.d && res.d.missing) || [];
          showErr(miss.length
            ? ('These photos are required and didn’t upload — please add them and submit again: ' + miss.join(', '))
            : ((res.d && res.d.message) || 'Please add the required photos and submit again.'));
          btn.disabled = false; btn.textContent = 'Submit clean report';
          return;
        }
        clearDraft();
        document.getElementById('form').classList.add('hidden'); document.getElementById('done').classList.remove('hidden'); window.scrollTo(0, 0);
      })
      .catch(function () { showErr('Sorry, something went wrong. Please try again.'); btn.disabled = false; btn.textContent = 'Submit clean report'; });
  };
</script>
</body>
