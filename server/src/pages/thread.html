<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Your messages · SimonStays</title>
<style>
  :root { --green:#1a7a3a; --green-d:#14622f; --ink:#1f2430; --muted:#6b7280; --line:#e3e6ea; --bg:#f4f6f4; }
  * { box-sizing:border-box; }
  html,body { margin:0; }
  body { font-family:-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif; color:var(--ink); background:var(--bg); line-height:1.5; }
  .wrap { max-width:720px; margin:0 auto; padding:16px; }
  .brand { font-size:22px; font-weight:800; color:var(--green); margin-bottom:12px; }
  .brand span { color:var(--ink); }
  .card { background:#fff; border:1px solid var(--line); border-radius:12px; padding:14px 16px; margin-bottom:12px; }
  .card b { display:block; }
  .muted { color:var(--muted); font-size:14px; }
  .bubbles { display:flex; flex-direction:column; gap:8px; margin-bottom:12px; }
  .bub { max-width:90%; padding:9px 12px; border-radius:12px; font-size:15px; white-space:pre-wrap; overflow-wrap:anywhere; }
  .bub.host { align-self:flex-start; background:#fff; border:1px solid var(--line); border-bottom-left-radius:4px; }
  .bub.mine { align-self:flex-end; background:#dff0e6; border-bottom-right-radius:4px; }
  .when { display:block; margin-top:3px; font-size:11px; color:var(--muted); }
  .bub a { color:inherit; }
  form { display:flex; gap:8px; align-items:flex-end; }
  textarea { flex:1; min-width:0; padding:10px; font:inherit; border:1px solid var(--line); border-radius:10px; resize:vertical; }
  button { padding:10px 18px; font:inherit; font-weight:600; color:#fff; background:var(--green); border:0; border-radius:10px; cursor:pointer; }
  button:hover { background:var(--green-d); }
  button:disabled { opacity:.6; cursor:default; }
  .err { color:#b3261e; font-size:14px; margin-top:6px; }
  .foot { margin-top:14px; font-size:13px; color:var(--muted); }
</style>
</head>
<body>
<main class="wrap">
  <div class="brand">Simon<span>Stays</span></div>
  <div id="app"><p class="muted">Loading your messages…</p></div>
  <p class="foot">This is your private link, so please don't share it. Need help? <a href="mailto:support@simonstays.co.za">support@simonstays.co.za</a> · 078 511 9336</p>
</main>
<script>
(function(){
  var token = location.pathname.split('/').pop();
  var api = '/public/thread/' + encodeURIComponent(token);
  var app = document.getElementById('app');
  function el(tag, cls, text){ var e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; }
  function day(d){ return new Date(d + 'T00:00:00').toLocaleDateString('en-ZA', { weekday:'short', day:'numeric', month:'short', year:'numeric' }); }
  function when(d){ return new Date(d).toLocaleString('en-ZA', { day:'numeric', month:'short', hour:'2-digit', minute:'2-digit' }); }
  // Text with its web links made clickable, built so nothing in it can run as HTML.
  function fill(node, text){
    var parts = String(text).split(/(https?:\/\/[^\s<]+[^\s<.,;:!?)])/);
    parts.forEach(function(p, i){
      if (i % 2) { var a = el('a', null, p); a.href = p; a.target = '_blank'; a.rel = 'noreferrer'; node.appendChild(a); }
      else node.appendChild(document.createTextNode(p));
    });
  }
  function bubble(m){
    var b = el('div', 'bub ' + (m.mine ? 'mine' : 'host'));
    fill(b, m.body);
    if (m.payLink) { b.appendChild(document.createElement('br')); var a = el('a', null, 'View invoice & pay'); a.href = m.payLink; a.target = '_blank'; a.rel = 'noreferrer'; b.appendChild(a); }
    b.appendChild(el('span', 'when', (m.mine ? 'You' : 'SimonStays') + ' · ' + when(m.createdAt)));
    return b;
  }
  function show(d){
    app.textContent = '';
    var c = el('div', 'card');
    c.appendChild(el('b', null, (d.place || 'Your stay') + (d.ref ? ' · ' + d.ref : '')));
    c.appendChild(el('span', 'muted', day(d.checkIn) + ' to ' + day(d.checkOut)));
    app.appendChild(c);
    var list = el('div', 'bubbles');
    if (!d.messages.length) list.appendChild(el('p', 'muted', 'No messages yet.'));
    d.messages.forEach(function(m){ list.appendChild(bubble(m)); });
    app.appendChild(list);
    var f = el('form'), t = el('textarea'), s = el('button', null, 'Send');
    t.rows = 2; t.placeholder = 'Write a message…'; t.setAttribute('aria-label', 'Your message');
    f.appendChild(t); f.appendChild(s);
    app.appendChild(f);
    var e = el('div', 'err'); app.appendChild(e);
    f.onsubmit = async function(ev){
      ev.preventDefault();
      var body = t.value.trim(); if (!body) return;
      s.disabled = true; e.textContent = '';
      try {
        var r = await fetch(api, { method:'POST', headers:{ 'Content-Type':'application/json' }, body:JSON.stringify({ body:body }) });
        var out = await r.json();
        if (!r.ok) throw new Error(out.message || 'Could not send that.');
        list.appendChild(bubble(out.message)); t.value = '';
      } catch (x) { e.textContent = x.message || 'Could not send that. Please try again.'; }
      s.disabled = false;
    };
  }
  fetch(api).then(function(r){ return r.json().then(function(d){ if (!r.ok) throw new Error(d.message || 'This link isn’t valid.'); show(d); }); })
    .catch(function(x){ app.textContent = ''; app.appendChild(el('div', 'card', x.message || 'Could not load your messages. Please try again.')); });
})();
</script>
</body>
</html>
