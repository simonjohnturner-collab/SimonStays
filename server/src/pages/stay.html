<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>SimonStays — Book your stay</title>
<link rel="icon" href="/favicon.svg" />
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css" />
<style>
  :root{ --green:#1a7a3a; --green-d:#14622f; --ink:#1f2430; --muted:#6b7280; --line:#e5e7eb; --bg:#f7f8fa; --card:#fff; --red:#c0392b; }
  *{ box-sizing:border-box; }
  body{ margin:0; font-family:-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif; color:var(--ink); background:var(--bg); }
  a{ color:var(--green); text-decoration:none; }
  button{ font:inherit; cursor:pointer; border:0; border-radius:8px; padding:10px 16px; background:var(--green); color:#fff; }
  button:hover{ background:var(--green-d); }
  button.ghost{ background:#eef1f4; color:var(--ink); }
  button.ghost:hover{ background:#e2e6ea; }
  button:disabled{ opacity:.5; cursor:default; }
  input,select{ font:inherit; padding:10px 12px; border:1px solid var(--line); border-radius:8px; width:100%; background:#fff; }
  header.top{ background:#fff; border-bottom:1px solid var(--line); position:sticky; top:0; z-index:30; }
  .top-in{ max-width:1120px; margin:0 auto; padding:12px 18px; display:flex; align-items:center; justify-content:space-between; gap:14px; flex-wrap:wrap; }
  .search-bar{ background:#fff; border:1px solid var(--line); border-radius:14px; padding:12px 14px; margin-bottom:16px; box-shadow:0 2px 10px rgba(0,0,0,.04); }
  .brand{ font-weight:800; font-size:22px; color:var(--green); letter-spacing:-.5px; white-space:nowrap; }
  .brand span{ color:var(--ink); }
  .become-host{ background:var(--green); color:#fff; border-radius:8px; padding:8px 14px; font-weight:600; font-size:14px; white-space:nowrap; }
  .become-host:hover{ background:var(--green-d); }
  .host-cta{ max-width:1120px; margin:30px auto 0; padding:22px; background:#eef6f0; border:1px solid #cfe6d6; border-radius:14px; text-align:center; }
  .host-cta h3{ margin:0 0 6px; }
  .host-cta p{ margin:0 0 12px; color:#374151; }
  .host-cta a{ display:inline-block; background:var(--green); color:#fff; border-radius:8px; padding:10px 18px; font-weight:600; }
  .host-cta a:hover{ background:var(--green-d); }
  .search{ display:flex; gap:8px; flex:1; flex-wrap:wrap; align-items:end; min-width:280px; }
  .search .fld{ display:flex; flex-direction:column; gap:3px; }
  .search .fld label{ font-size:11px; color:var(--muted); font-weight:600; padding-left:2px; }
  .search .fld.q{ flex:1; min-width:180px; }
  .search .fld.d input{ width:150px; }
  .search .fld.g input{ width:80px; }
  .search .fld.r select{ width:140px; }
  .wrap{ max-width:1120px; margin:0 auto; padding:16px 18px 60px; }
  .toolbar{ display:flex; align-items:center; justify-content:space-between; gap:10px; margin:6px 0 14px; flex-wrap:wrap; }
  .count{ color:var(--muted); font-size:14px; }
  .toggle{ display:inline-flex; border:1px solid var(--line); border-radius:8px; overflow:hidden; }
  .toggle button{ background:#fff; color:var(--ink); border-radius:0; padding:8px 14px; }
  .toggle button.on{ background:var(--green); color:#fff; }
  .grid{ display:grid; grid-template-columns:repeat(auto-fill,minmax(280px,1fr)); gap:16px; }
  .card{ background:var(--card); border:1px solid var(--line); border-radius:14px; overflow:hidden; cursor:pointer; transition:box-shadow .15s, transform .15s; }
  .card:hover{ box-shadow:0 8px 26px rgba(0,0,0,.10); transform:translateY(-2px); }
  .card .ph{ aspect-ratio:4/3; background:#e9edf1 center/cover no-repeat; }
  .card .body{ padding:12px 14px; }
  .card .nm{ font-weight:700; font-size:16px; }
  .card .sub{ color:var(--muted); font-size:13px; margin-top:2px; }
  .card .price{ margin-top:8px; font-weight:700; }
  .card .price small{ color:var(--muted); font-weight:400; }
  #map{ height:70vh; min-height:420px; border-radius:14px; border:1px solid var(--line); }
  .empty{ text-align:center; color:var(--muted); padding:60px 20px; }
  /* Detail overlay */
  .overlay{ position:fixed; inset:0; background:rgba(15,20,30,.55); z-index:50; display:flex; justify-content:center; align-items:flex-start; padding:24px; overflow:auto; }
  .sheet{ background:#fff; border-radius:16px; max-width:900px; width:100%; overflow:hidden; }
  .sheet-head{ display:flex; align-items:center; justify-content:space-between; padding:14px 18px; border-bottom:1px solid var(--line); position:sticky; top:0; background:#fff; z-index:2; }
  .sheet-head h2{ margin:0; font-size:19px; }
  .x{ background:transparent; color:var(--muted); font-size:26px; line-height:1; padding:0 8px; }
  .x:hover{ background:transparent; color:var(--ink); }
  .sheet-body{ padding:18px; }
  .gallery{ display:grid; grid-template-columns:2fr 1fr 1fr; grid-auto-rows:120px; gap:6px; border-radius:12px; overflow:hidden; margin-bottom:14px; }
  .gallery .g0{ grid-row:span 2; grid-column:1; }
  .gallery img{ width:100%; height:100%; object-fit:cover; cursor:zoom-in; }
  .desc{ white-space:pre-wrap; line-height:1.5; color:#374151; margin:10px 0 16px; }
  .sec{ margin:18px 0 8px; font-size:16px; }
  .host-by{ display:flex; align-items:center; gap:10px; margin:10px 0 4px; font-size:14px; }
  .host-av{ width:40px; height:40px; border-radius:50%; object-fit:cover; background:#eef1f4; display:inline-flex; align-items:center; justify-content:center; font-size:20px; flex-shrink:0; }
  .detail-map{ height:220px; border-radius:12px; border:1px solid var(--line); margin:8px 0 6px; }
  .gallery.small{ grid-template-columns:repeat(3,1fr); grid-auto-rows:90px; }
  .gallery.small .g0{ grid-row:auto; grid-column:auto; }
  .amen{ display:flex; flex-wrap:wrap; gap:8px; margin:10px 0 18px; }
  .amen .a{ background:#eef6f0; color:var(--green-d); border-radius:999px; padding:5px 12px; font-size:13px; }
  .units{ display:flex; flex-direction:column; gap:10px; }
  .unit{ border:1px solid var(--line); border-radius:12px; padding:10px; cursor:pointer; display:flex; gap:12px; align-items:stretch; }
  .unit:hover{ border-color:#cdd3da; }
  .unit.sel{ border-color:var(--green); box-shadow:0 0 0 2px rgba(26,122,58,.15); }
  .unit-thumb{ width:110px; flex-shrink:0; border-radius:8px; background:#e9edf1 center/cover no-repeat; align-self:stretch; min-height:80px; }
  .unit-thumb.empty{ background:#eef1f4; }
  .unit-info{ flex:1; min-width:0; display:flex; flex-direction:column; gap:3px; }
  .unit-top{ display:flex; align-items:center; justify-content:space-between; gap:10px; }
  .unit-nm{ font-weight:700; }
  .unit-meta{ color:var(--muted); font-size:13px; }
  .unit-desc{ font-size:13px; color:#4b5563; line-height:1.4; margin-top:2px; display:-webkit-box; -webkit-line-clamp:3; -webkit-box-orient:vertical; overflow:hidden; }
  .book-panel{ margin-top:16px; border-top:1px solid var(--line); padding-top:16px; }
  .cal-wrap{ display:flex; gap:18px; flex-wrap:wrap; }
  .cal{ border:1px solid var(--line); border-radius:12px; padding:10px; width:260px; }
  .cal-head{ display:flex; align-items:center; justify-content:space-between; margin-bottom:6px; font-weight:700; font-size:14px; }
  .cal-head button{ background:#eef1f4; color:var(--ink); padding:2px 10px; }
  .cal-grid{ display:grid; grid-template-columns:repeat(7,1fr); gap:2px; }
  .cal-dow{ font-size:11px; color:var(--muted); text-align:center; padding:2px 0; }
  .cal-day{ text-align:center; padding:7px 0; border-radius:7px; font-size:13px; cursor:pointer; user-select:none; }
  .cal-day.pad{ visibility:hidden; }
  .cal-day.off{ color:#c8ccd2; text-decoration:line-through; cursor:default; }
  .cal-day.booked{ background:#fdecec; color:#c0392b; text-decoration:line-through; cursor:default; }
  .cal-day.avail:hover{ background:#eef6f0; }
  .cal-day.inrange{ background:#dff0e6; }
  .cal-day.end{ background:var(--green); color:#fff; }
  .cal-legend{ font-size:12px; color:var(--muted); margin-top:6px; display:flex; gap:12px; flex-wrap:wrap; }
  .cal-legend i{ display:inline-block; width:10px; height:10px; border-radius:3px; vertical-align:-1px; margin-right:3px; }
  .side{ flex:1; min-width:240px; }
  .qbox{ border:1px solid var(--line); border-radius:12px; padding:14px; background:#fafbfc; }
  .qrow{ display:flex; justify-content:space-between; padding:3px 0; }
  .qtot{ font-weight:800; font-size:18px; border-top:1px solid var(--line); margin-top:6px; padding-top:8px; }
  .frm{ display:grid; gap:8px; margin-top:12px; }
  .frm .two{ display:grid; grid-template-columns:1fr 1fr; gap:8px; }
  .note{ font-size:13px; color:var(--muted); }
  .todo{ background:#fff7e6; border:1px solid #f0d9a8; color:#8a5a00; border-radius:10px; padding:10px 12px; font-size:13px; margin:10px 0; }
  .addons{ border:1px solid var(--line); border-radius:10px; padding:10px 12px; margin:10px 0; }
  .addon{ display:flex; align-items:center; gap:8px; padding:4px 0; cursor:pointer; font-size:14px; }
  .addon input{ width:auto; }
  .note.small{ font-size:12px; line-height:1.4; }
  .cta-btn{ width:100%; margin-top:12px; padding:12px; font-size:15px; }
  .co-back{ background:#eef1f4; color:var(--ink); padding:6px 12px; }
  .co-back:hover{ background:#e2e6ea; }
  .co-hero{ width:100%; aspect-ratio:16/9; background:#e9edf1 center/cover no-repeat; border-radius:12px; }
  .pay-opts{ display:flex; flex-direction:column; gap:6px; margin:6px 0; }
  .pay-opt{ display:flex; align-items:center; gap:8px; border:1px solid var(--line); border-radius:10px; padding:10px 12px; cursor:pointer; font-size:14px; }
  .pay-opt:hover{ border-color:#cdd3da; }
  .pay-opt input{ width:auto; }
  .eft-box{ background:#eef6f0; border:1px solid #cfe6d6; border-radius:10px; padding:12px 14px; font-size:14px; line-height:1.6; margin:6px 0; }
  .ref-badge{ display:inline-block; background:#eef6f0; border:1px dashed #a9d4b8; border-radius:10px; padding:8px 16px; margin:6px 0; font-size:14px; color:var(--green-d); }
  .ref-badge b{ font-size:20px; letter-spacing:.5px; }
  .frm textarea{ font:inherit; padding:10px 12px; border:1px solid var(--line); border-radius:8px; width:100%; min-height:60px; background:#fff; }
  .msg{ padding:9px 12px; border-radius:8px; margin:8px 0; font-size:14px; }
  .msg.err{ background:#fdecec; color:#c0392b; }
  .msg.ok{ background:#eafaf0; color:var(--green-d); }
  .done{ text-align:center; padding:26px 10px; }
  .done .big{ font-size:40px; }
  .lightbox{ position:fixed; inset:0; background:rgba(0,0,0,.9); z-index:70; display:flex; align-items:center; justify-content:center; padding:20px; }
  .lightbox img{ max-width:100%; max-height:100%; border-radius:8px; }
  .lightbox .x{ position:absolute; top:14px; right:18px; color:#fff; font-size:34px; }
  @media(max-width:640px){ .gallery{ grid-template-columns:1fr 1fr; } .gallery .g0{ grid-column:span 2; } }
</style>
</head>
<body>
<header class="top">
  <div class="top-in">
    <div class="brand">Simon<span>Stays</span></div>
    <a class="become-host" href="__ADMIN_URL__/?signup">Sign up to become a host</a>
  </div>
</header>

<div class="wrap">
  <div class="search-bar">
    <div class="search">
      <div class="fld q"><label>Where to?</label><input id="q" placeholder="Search area, complex or address…" /></div>
      <div class="fld d"><label>Check-in</label><input id="ci" type="date" /></div>
      <div class="fld d"><label>Check-out</label><input id="co" type="date" /></div>
      <div class="fld g"><label>Guests</label><input id="g" type="number" min="1" placeholder="2" /></div>
      <div class="fld r"><label>Distance</label><select id="radius"><option value="1">Within 1 km</option><option value="5">Within 5 km</option><option value="10">Within 10 km</option><option value="25" selected>Within 25 km</option><option value="50">Within 50 km</option><option value="200">Within 200 km</option></select></div>
      <div class="fld"><label>&nbsp;</label><button id="searchBtn">Search</button></div>
    </div>
  </div>
  <div class="toolbar">
    <div class="count" id="count">Loading stays…</div>
    <div class="toggle">
      <button id="tList" class="on">☰ List</button>
      <button id="tMap">🗺 Map</button>
    </div>
  </div>
  <div id="results" class="grid"></div>
  <div id="map" style="display:none"></div>

  <div class="host-cta">
    <h3>Own a property? List it on SimonStays.</h3>
    <p>We take the bookings and payments and pay you out — you manage your own listings, prices and calendar.</p>
    <a href="__ADMIN_URL__/?signup">Become a host ↗</a>
  </div>
</div>

<div id="detail"></div>
<div id="lightbox"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script>
(function(){
  var API=''; // same origin (served by the API)
  var UNITS=[], VIEW='list', MAP=null, LAYER=null, HOST=null, GEO=null;
  fetch('/public/host').then(function(r){return r.json();}).then(function(d){ HOST=d.host||null; }).catch(function(){});
  var $=function(s){ return document.querySelector(s); };
  var el=function(t,c,h){ var e=document.createElement(t); if(c)e.className=c; if(h!=null)e.innerHTML=h; return e; };
  var rand=function(c){ return 'R'+(c/100).toLocaleString('en-ZA',{minimumFractionDigits:2,maximumFractionDigits:2}); };
  var iso=function(d){ return d.toISOString().slice(0,10); };
  var todayISO=iso(new Date());
  $('#ci').min=todayISO; $('#co').min=todayISO;

  function qs(){
    var p=new URLSearchParams();
    if($('#ci').value && $('#co').value){ p.set('checkIn',$('#ci').value); p.set('checkOut',$('#co').value); }
    if($('#g').value) p.set('guests',$('#g').value);
    return p.toString();
  }
  function textMatch(u,q){
    if(!q) return true; q=q.toLowerCase();
    return (u.propertyName||'').toLowerCase().indexOf(q)>=0 || (u.unitName||'').toLowerCase().indexOf(q)>=0 || (u.address||'').toLowerCase().indexOf(q)>=0;
  }
  // Great-circle distance in km between two lat/lng points.
  function kmBetween(a,b,c,d){ var R=6371, r=Math.PI/180;
    var dLat=(c-a)*r, dLng=(d-b)*r, s=Math.sin(dLat/2)*Math.sin(dLat/2)+Math.cos(a*r)*Math.cos(c*r)*Math.sin(dLng/2)*Math.sin(dLng/2);
    return R*2*Math.atan2(Math.sqrt(s),Math.sqrt(1-s)); }
  function radiusKm(){ return Number($('#radius').value)||25; }
  function geoNear(u){ return GEO && u.latitude!=null && u.longitude!=null && kmBetween(GEO.lat,GEO.lng,u.latitude,u.longitude)<=radiusKm(); }
  function shortLabel(s){ return String(s||'').split(',').slice(0,2).join(', '); }

  async function load(){
    $('#count').textContent='Loading stays…';
    try{
      var r=await fetch(API+'/public/units'+(qs()?'?'+qs():''));
      var d=await r.json(); UNITS=d.units||[]; render();
    }catch(e){ $('#count').textContent='Could not load stays. Please refresh.'; }
  }

  // A unit matches if its text matches the query, or (when we geocoded the
  // query to a point) its dropped pin is within the chosen radius of that point.
  function filtered(){ var q=$('#q').value.trim(); return UNITS.filter(function(u){ if(textMatch(u,q)) return true; return geoNear(u); }); }

  function priceLabel(u){
    if(u.stayFromCents>0) return '<span class="price">'+rand(u.stayFromCents)+' <small>total for your dates</small></span>';
    if(u.fromNightlyCents>0) return '<span class="price">from '+rand(u.fromNightlyCents)+' <small>/ night</small></span>';
    return '<span class="price"><small>Contact us to book</small></span>';
  }
  function unitTitle(u){ return esc(u.propertyName)+' · Unit '+esc(u.unitName); }
  function unitSub(u){ var m=[]; if(u.capacity)m.push('sleeps '+u.capacity); if(u.bedrooms)m.push(u.bedrooms+' bed'); if(u.bathrooms)m.push(u.bathrooms+' bath'); return (u.address?esc(u.address):'')+(m.length?(' · '+m.join(' · ')):''); }

  function render(){
    var list=filtered();
    $('#count').textContent=list.length+' '+(list.length===1?'stay':'stays')+(GEO?(' within '+radiusKm()+' km of '+shortLabel(GEO.label)):'')+(($('#ci').value&&$('#co').value)?' available for your dates':'');
    var box=$('#results'); box.innerHTML='';
    if(list.length===0){ box.appendChild(el('div','empty', GEO ? ('No stays within '+radiusKm()+' km of '+shortLabel(GEO.label)+'. Try a larger distance or clear the dates.') : 'No stays match your search. Type an area and press Search, widen the distance, or clear the dates.')); }
    list.forEach(function(u){
      var c=el('div','card');
      var img=u.coverPhotoId?('background-image:url('+API+'/photos/'+u.coverPhotoId+')'):'';
      c.innerHTML='<div class="ph" style="'+img+'"></div><div class="body"><div class="nm">'+unitTitle(u)+'</div>'+
        '<div class="sub">'+unitSub(u)+'</div>'+priceLabel(u)+'</div>';
      c.onclick=function(){ openUnit(u); };
      box.appendChild(c);
    });
    if(VIEW==='map') drawMap(list);
  }

  function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g,function(m){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m];}); }

  // ---- Map ----
  function drawMap(list){
    if(!MAP){
      MAP=L.map('map').setView([-26.15,28.04],11);
      L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'© OpenStreetMap'}).addTo(MAP);
    }
    if(LAYER) MAP.removeLayer(LAYER);
    LAYER=L.layerGroup().addTo(MAP);
    var pts=[], seen={};
    if(GEO){
      L.circle([GEO.lat,GEO.lng],{radius:radiusKm()*1000,color:'#2e7d5b',weight:1,fillColor:'#2e7d5b',fillOpacity:0.06}).addTo(LAYER);
      pts.push([GEO.lat,GEO.lng]);
    }
    list.forEach(function(u,i){
      if(u.latitude==null||u.longitude==null) return;
      // Nudge overlapping pins (multiple units at one complex) so all are clickable.
      var k=u.latitude+','+u.longitude; var n=seen[k]=(seen[k]||0)+1;
      var lat=u.latitude+(n-1)*0.00012, lng=u.longitude+(n-1)*0.00012;
      var m=L.marker([lat,lng]).addTo(LAYER);
      var pl=u.stayFromCents>0?rand(u.stayFromCents):(u.fromNightlyCents>0?('from '+rand(u.fromNightlyCents)+'/night'):'Contact us to book');
      m.bindPopup('<b>'+unitTitle(u)+'</b><br>'+esc(u.address||'')+'<br>'+pl+'<br><a href="#" data-i="'+i+'" class="mpop">View & book →</a>');
      pts.push([lat,lng]);
    });
    MAP._unitList=list;
    setTimeout(function(){ MAP.invalidateSize(); if(pts.length) MAP.fitBounds(pts,{padding:[40,40],maxZoom:15}); },80);
  }
  document.addEventListener('click',function(e){ if(e.target.classList&&e.target.classList.contains('mpop')){ e.preventDefault(); var i=Number(e.target.getAttribute('data-i')); if(MAP&&MAP._unitList&&MAP._unitList[i]) openUnit(MAP._unitList[i]); } });

  function setView(v){
    VIEW=v; $('#tList').classList.toggle('on',v==='list'); $('#tMap').classList.toggle('on',v==='map');
    $('#results').style.display=v==='list'?'grid':'none'; $('#map').style.display=v==='map'?'block':'none';
    if(v==='map') drawMap(filtered());
  }
  $('#tList').onclick=function(){ setView('list'); };
  $('#tMap').onclick=function(){ setView('map'); };
  // Search: geocode the typed area so we can also match stays whose dropped pin
  // is within the chosen distance, then (re)load for the dates.
  async function doSearch(){
    var q=$('#q').value.trim(); GEO=null;
    if(q){
      $('#count').textContent='Searching…';
      try{ var r=await fetch('/public/geocode?q='+encodeURIComponent(q)); var d=await r.json(); if(d&&d.result) GEO=d.result; }catch(e){}
    }
    await load();
  }
  $('#searchBtn').onclick=doSearch;
  $('#q').addEventListener('keydown',function(e){ if(e.key==='Enter') doSearch(); });
  // Typing changes the text filter immediately; a prior geo result is cleared so
  // it can't mislead until the next Search.
  $('#q').addEventListener('input',function(){ GEO=null; render(); });
  $('#radius').addEventListener('change',render);
  ['ci','co'].forEach(function(id){ $('#'+id).addEventListener('change',function(){ if($('#ci').value) $('#co').min=$('#ci').value; }); });

  // ---- Unit detail + booking (one unit per listing; no sibling navigation) ----
  var STATE={}, DMAP=null;
  async function openUnit(card){
    var host=$('#detail'); host.innerHTML='<div class="overlay"><div class="sheet"><div class="sheet-body"><p class="note">Loading…</p></div></div></div>';
    host.firstChild.onclick=function(e){ if(e.target===host.firstChild) host.innerHTML=''; };
    try{
      var r=await fetch(API+'/public/properties/'+card.propertyId); var d=await r.json(); var p=d.property;
      var unit=(p.units||[]).find(function(x){return x.id===card.unitId;}) || (p.units||[])[0];
      STATE={ prop:p, unit:unit, month:startMonth(), booked:[], ciSel:null, coSel:null, quote:null };
      renderDetail();
      loadCal();
    }catch(e){ host.innerHTML=''; alert('Could not load this stay.'); }
  }
  function startMonth(){ var d=new Date(); d.setDate(1); d.setHours(0,0,0,0); return d; }
  function galleryHtml(photos){ return '<div class="gallery">'+photos.map(function(ph,i){ return '<img class="g'+i+'" data-full="'+API+'/photos/'+ph.id+'" src="'+API+'/photos/'+ph.id+'">'; }).join('')+'</div>'; }

  function renderDetail(){
    var p=STATE.prop, u=STATE.unit||{}, host=$('#detail');
    var unitPhotos=(u.photos||[]);

  function lightbox(src){ var l=$('#lightbox'); l.innerHTML='<div class="lightbox"><span class="x">&times;</span><img src="'+src+'"></div>'; l.firstChild.onclick=function(){ l.innerHTML=''; }; }

  async function loadCal(){
    if(!STATE.unit) return;
    try{
      var from=todayISO, to=iso(new Date(Date.now()+365*864e5));
      var r=await fetch(API+'/public/units/'+STATE.unit.id+'/calendar?from='+from+'&to='+to);
      var d=await r.json(); STATE.booked=d.booked||[]; renderBookPanel();
    }catch(e){ STATE.booked=[]; renderBookPanel(); }
  }

  // Build the set of booked NIGHTS (checkIn..checkOut-1) — checkout day stays bookable.
  function bookedNights(){
    var set={};
    (STATE.booked||[]).forEach(function(b){
      var d=new Date(b.checkIn+'T00:00:00'), end=new Date(b.checkOut+'T00:00:00');
      for(; d<end; d.setDate(d.getDate()+1)) set[iso(d)]=1;
    });
    return set;
  }
  function rangeHasBooked(a,b){ var nb=bookedNights(); var d=new Date(a+'T00:00:00'), end=new Date(b+'T00:00:00'); for(; d<end; d.setDate(d.getDate()+1)){ if(nb[iso(d)]) return true; } return false; }

  function monthCal(base, nb){
    var y=base.getFullYear(), m=base.getMonth();
    var first=new Date(y,m,1), start=first.getDay();
    var days=new Date(y,m+1,0).getDate();
    var name=base.toLocaleDateString('en-ZA',{month:'long',year:'numeric'});
    var cells='';
    ['S','M','T','W','T','F','S'].forEach(function(d){ cells+='<div class="cal-dow">'+d+'</div>'; });
    for(var i=0;i<start;i++) cells+='<div class="cal-day pad"></div>';
    for(var day=1; day<=days; day++){
      var ds=iso(new Date(y,m,day));
      var cls='cal-day'; var past=ds<todayISO;
      if(past) cls+=' off';
      else if(nb[ds]) cls+=' booked';
      else{
        cls+=' avail';
        if(STATE.ciSel && STATE.coSel && ds>=STATE.ciSel && ds<STATE.coSel) cls+=' inrange';
        if(ds===STATE.ciSel || ds===STATE.coSel) cls+=' end';
      }
      cells+='<div class="'+cls+'" data-d="'+ds+'">'+day+'</div>';
    }
    return '<div class="cal"><div class="cal-head"><button class="cnav" data-dir="-1">‹</button><span>'+name+'</span><button class="cnav" data-dir="1">›</button></div><div class="cal-grid">'+cells+'</div></div>';
  }

  function renderBookPanel(){
    var panel=$('#bookPanel'); if(!panel) return;
    var u=STATE.unit;
    if(!u){ panel.innerHTML='<p class="note">Select a unit above to see availability and prices.</p>'; return; }
    if(!u.hasPricing){ panel.innerHTML='<div class="todo">This unit isn’t set up for online booking yet — please contact us to book.</div>'; return; }
    var nb=bookedNights();
    var m2=new Date(STATE.month); m2.setMonth(m2.getMonth()+1);
    panel.innerHTML='<h3 style="margin:0 0 10px">Pick your dates</h3>'+
      '<div class="cal-wrap"><div>'+
        '<div style="display:flex; gap:10px; flex-wrap:wrap">'+monthCal(new Date(STATE.month),nb)+monthCal(m2,nb)+'</div>'+
        '<div class="cal-legend"><span><i style="background:#fdecec"></i>Booked</span><span><i style="background:var(--green)"></i>Your dates</span></div>'+
      '</div><div class="side" id="side"></div></div>';
    // calendar interactions
    panel.querySelectorAll('.cnav').forEach(function(b){ b.onclick=function(){ var mo=new Date(STATE.month); mo.setMonth(mo.getMonth()+Number(b.getAttribute('data-dir'))); if(mo<startMonth())mo=startMonth(); STATE.month=mo; renderBookPanel(); }; });
    panel.querySelectorAll('.cal-day.avail').forEach(function(node){ node.onclick=function(){ pickDate(node.getAttribute('data-d')); }; });
    renderSide();
  }

  function pickDate(ds){
    if(!STATE.ciSel || (STATE.ciSel && STATE.coSel)){ STATE.ciSel=ds; STATE.coSel=null; STATE.quote=null; }
    else if(ds<=STATE.ciSel){ STATE.ciSel=ds; STATE.coSel=null; STATE.quote=null; }
    else if(rangeHasBooked(STATE.ciSel,ds)){ STATE.ciSel=ds; STATE.coSel=null; STATE.quote=null; }
    else{ STATE.coSel=ds; getQuote(); }
    renderBookPanel();
  }

  async function getQuote(){
    if(!STATE.ciSel||!STATE.coSel) return;
    try{
      var r=await fetch(API+'/public/quote',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({unitId:STATE.unit.id,checkIn:STATE.ciSel,checkOut:STATE.coSel,earlyCheckIn:!!STATE.early,lateCheckOut:!!STATE.late})});
      var d=await r.json(); STATE.quote=d.quote||null; STATE.quoteErr=d.quote?null:(d.message||'No price available for these dates.');
    }catch(e){ STATE.quote=null; STATE.quoteErr='Could not price these dates.'; }
    renderSide();
  }

      '<div class="note small" style="margin-top:4px">Early check-in and late checkout are only possible depending on the guests arriving or departing that day. Where confirmed, <b>late checkout is by 13:30</b>.</div>'+
      '</div>';

  // Shared price breakdown (used on the calendar side and the checkout screen).

    var lines='<div class="qrow"><span>'+q.nights+' night'+(q.nights>1?'s':'')+' @ '+rand(q.avgNightlyCents)+'</span><span>'+rand(q.accommodationCents)+'</span></div>';

  async function confirmBooking(overlay){
    var name=overlay.querySelector('#gName').value.trim(), email=overlay.querySelector('#gEmail').value.trim(), phone=overlay.querySelector('#gPhone').value.trim();
    var cm=overlay.querySelector('#cmsg');
    if(!name){ cm.innerHTML='<div class="msg err">Please enter your name.</div>'; return; }
    if(!email && !phone){ cm.innerHTML='<div class="msg err">Please give an email or phone number.</div>'; return; }
    var method=overlay.querySelector('input[name=pm]:checked').value;
    var plan=overlay.querySelector('input[name=pp]:checked').value;
    var btn=overlay.querySelector('#confirmBtn'); btn.disabled=true; btn.textContent='Booking…'; cm.innerHTML='';
    STATE.guest={ name:name, email:email, phone:phone, guests:overlay.querySelector('#gGuests').value||'', message:overlay.querySelector('#gMsg').value||'' };
    STATE.method=method; STATE.plan=plan;
    try{
      var body={ unitId:STATE.unit.id, checkIn:STATE.ciSel, checkOut:STATE.coSel, guestName:name, guestEmail:email, guestPhone:phone, guests:STATE.guest.guests||undefined, message:STATE.guest.message||undefined, earlyCheckIn:!!STATE.early, lateCheckOut:!!STATE.late, paymentMethod:method, paymentPlan:plan };
      var r=await fetch(API+'/public/book',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
      var d=await r.json();
      if(!r.ok){ cm.innerHTML='<div class="msg err">'+esc(d.message||'Could not create the booking.')+'</div>'; btn.disabled=false; btn.textContent='Confirm booking'; return; }
      STATE.ref=d.ref||null;
      if(method==='card' && d.payment && d.payment.mode==='redirect'){ window.location=d.payment.url; return; }
      if(method==='card'){
