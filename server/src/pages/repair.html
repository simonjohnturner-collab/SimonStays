<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%231a7a3a'/%3E%3Ctext x='16' y='23' font-family='Arial,Helvetica,sans-serif' font-size='22' font-weight='700' fill='white' text-anchor='middle'%3ES%3C/text%3E%3C/svg%3E">
<title>Repair report · SimonStays</title>
<style>
  :root { --green:#1a7a3a; --green-d:#14622f; --ink:#1f2430; --muted:#6b7280; --line:#e3e6ea; --bg:#f4f6f4; --red:#cc2b2b; }
  * { box-sizing:border-box; }
  html,body { margin:0; }
  body { font-family:-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif; color:var(--ink); background:var(--bg); line-height:1.5; }
  .top { background:var(--green); color:#fff; padding:18px 16px; }
  .brand { font-weight:800; font-size:20px; letter-spacing:-.3px; }
  .brand span { color:#bfe6cd; }
  .top p { margin:4px 0 0; font-size:13px; opacity:.9; }
  .wrap { max-width:560px; margin:0 auto; padding:16px 14px 60px; }
  label { display:block; font-size:13px; font-weight:600; color:var(--ink); margin:14px 0 5px; }
  .req::after { content:" *"; color:var(--red); }
  input,select,textarea { width:100%; font:inherit; font-size:16px; padding:11px 12px; border:1px solid var(--line); border-radius:10px; background:#fff; }
  input:focus,select:focus,textarea:focus { outline:none; border-color:var(--green); }
  textarea { resize:vertical; min-height:80px; }
  .hint { font-size:12px; color:var(--muted); margin:4px 0 0; }
  .amount-row { position:relative; }
  .amount-row .cur { position:absolute; left:12px; top:50%; transform:translateY(-50%); color:var(--muted); font-size:16px; }
  .amount-row input { padding-left:28px; }
  .unit-card { background:#fff; border:1px solid var(--line); border-radius:14px; padding:14px; margin-top:14px; box-shadow:0 1px 2px rgba(0,0,0,.04); }
  .unit-head { display:flex; justify-content:space-between; align-items:center; }
  .unit-head h3 { margin:0; font-size:15px; }
  .unit-card label:first-of-type { margin-top:8px; }
  .rm { background:none; border:0; color:var(--muted); font-size:13px; cursor:pointer; text-decoration:underline; padding:0; }
  .rm:hover { color:var(--red); }
  .photos { display:flex; flex-wrap:wrap; gap:8px; margin-top:8px; }
  .thumb { position:relative; width:80px; height:80px; border-radius:9px; overflow:hidden; border:1px solid var(--line); }
  .thumb img { width:100%; height:100%; object-fit:cover; display:block; }
  .thumb button { position:absolute; top:2px; right:2px; width:20px; height:20px; border-radius:50%; border:0; background:rgba(0,0,0,.6); color:#fff; font-size:12px; line-height:1; cursor:pointer; }
  .photo-btns { display:flex; gap:8px; margin-top:8px; }
  .pbtn { flex:1; text-align:center; padding:12px; border:1px solid var(--line); border-radius:10px; background:#fff; color:var(--ink); font-size:14px; font-weight:600; cursor:pointer; }
  .pbtn:hover { border-color:var(--green); color:var(--green); }
  .pbtn input { display:none; }
  .add-unit { width:100%; margin-top:14px; padding:12px; background:#eafaf0; color:var(--green-d); border:1px solid #cdeede; border-radius:12px; font-weight:600; font-size:15px; cursor:pointer; }
  .add-unit:hover { background:#dff5e8; }
  .submit { width:100%; margin-top:22px; padding:15px; background:var(--green); color:#fff; border:0; border-radius:12px; font-weight:700; font-size:16px; cursor:pointer; }
  .submit:hover { background:var(--green-d); }
  .submit:disabled { opacity:.6; }
  .msg { margin-top:14px; font-size:14px; padding:10px 12px; border-radius:10px; }
  .msg.err { background:#fdeaea; color:#a11; }
  .done { background:#fff; border:1px solid var(--line); border-radius:14px; padding:28px 20px; text-align:center; margin-top:20px; }
  .done .tick { font-size:46px; }
  .done h2 { margin:8px 0 6px; }
  .done p { color:var(--muted); margin:0 0 18px; }
  .hidden { display:none; }
</style>
</head>
<body>
  <div class="top">
    <div class="brand">Simon<span>Stays</span></div>
    <p>Repair report — confirm the work and request payment</p>
  </div>

  <div class="wrap">
    <form id="form">
      <label class="req" for="name">Your name</label>
      <input type="text" id="name" placeholder="Full name" required>

      <label class="req" for="date">Date of the repair</label>
      <input type="date" id="date" required>

      <div id="units"></div>
      <button type="button" class="add-unit" id="addUnit">＋ Add another unit</button>

      <label class="req" for="amount">Total amount to be paid</label>
      <div class="amount-row"><span class="cur">R</span><input type="number" id="amount" inputmode="decimal" min="0" step="0.01" placeholder="0.00"></div>
      <p class="hint">The total you're charging for all the repairs above.</p>

      <label class="req" for="paymethod">How should we pay you?</label>
      <select id="paymethod">
        <option value="ewallet">E-wallet (send to a phone number)</option>
        <option value="bank">Bank account</option>
      </select>
      <div id="ewalletWrap">
        <label class="req" for="phone">E-wallet phone number</label>
        <input type="tel" id="phone" inputmode="tel" placeholder="e.g. 082 123 4567">
      </div>
      <div id="bankWrap" class="hidden">
        <label class="req" for="bank">Bank account details</label>
        <textarea id="bank" placeholder="Bank, account name, account number, branch code."></textarea>
      </div>

      <div id="msg"></div>
      <button type="submit" class="submit" id="submit">Submit repair report</button>
    </form>

    <div id="done" class="done hidden">
      <div class="tick">✅</div>
      <h2>Thank you</h2>
      <p>Your repair report and payment request have been sent to the host.</p>
      <button class="submit" onclick="location.reload()">Submit another repair</button>
    </div>
  </div>

<script>
  var PROPS = [];
  // Each entry is one unit's repair: { unitId, desc, files:[File], resolveId, issues }
  var units = [{ unitId: '', desc: '', files: [], resolveId: '', issues: null }];

  function el(tag, cls, text) { var e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; }
  function unitLabel(unitId) {
    for (var i = 0; i < PROPS.length; i++) { var p = PROPS[i]; for (var j = 0; j < (p.units || []).length; j++) { if (p.units[j].id === unitId) return p.name + ' · ' + p.units[j].name; } }
    return '';
  }

  function readRaw(file) {
    return new Promise(function (resolve) {
      var r = new FileReader();
      r.onload = function () { resolve({ dataBase64: r.result, contentType: file.type || 'image/jpeg' }); };
      r.onerror = function () { resolve(null); };
      r.readAsDataURL(file);
    });
  }
  function prep(file, maxDim, quality) {
    return new Promise(function (resolve) {
      var done = false, img = new Image(), url = URL.createObjectURL(file);
      var fallback = function () { if (done) return; done = true; try { URL.revokeObjectURL(url); } catch (e) {} readRaw(file).then(resolve); };
      img.onload = function () {
        try {
          URL.revokeObjectURL(url);
          var w = img.width, h = img.height; if (!w || !h) return fallback();
          if (Math.max(w, h) > maxDim) { var s = maxDim / Math.max(w, h); w = Math.round(w * s); h = Math.round(h * s); }
          var c = document.createElement('canvas'); c.width = w; c.height = h;
          c.getContext('2d').drawImage(img, 0, 0, w, h);
          var out = c.toDataURL('image/jpeg', quality);
          if (!out || out.length < 100) return fallback();
          done = true; resolve({ dataBase64: out, contentType: 'image/jpeg' });
        } catch (e) { fallback(); }
      };
      img.onerror = fallback; img.src = url;
    });
  }

  function loadBlockIssues(blk) {
    if (!blk.unitId) { blk.issues = null; renderUnits(); return; }
    fetch('/public/forms/open-issues?unitId=' + encodeURIComponent(blk.unitId))
      .then(function (r) { return r.json(); })
      .then(function (d) { blk.issues = (d && d.issues) || []; renderUnits(); })
      .catch(function () { blk.issues = []; renderUnits(); });
  }

  function renderUnits() {
    var wrap = document.getElementById('units'); wrap.innerHTML = '';
    units.forEach(function (blk, idx) {
      var card = el('div', 'unit-card');
      var head = el('div', 'unit-head'); head.appendChild(el('h3', null, 'Unit repair ' + (idx + 1)));
      if (units.length > 1) { var rm = el('button', 'rm', 'Remove'); rm.type = 'button'; rm.onclick = function () { units.splice(idx, 1); renderUnits(); }; head.appendChild(rm); }
      card.appendChild(head);

      var ul = el('label', 'req', 'Which unit?'); card.appendChild(ul);
      var usel = el('select', 'unit-sel'); usel.innerHTML = '<option value="">Select the unit…</option>';
      PROPS.forEach(function (p) { (p.units || []).forEach(function (u) { var o = el('option', null, p.name + ' · ' + u.name); o.value = u.id; usel.appendChild(o); }); });
      usel.value = blk.unitId || '';
      usel.onchange = function () { blk.unitId = usel.value; blk.resolveId = ''; blk.issues = null; loadBlockIssues(blk); };
      card.appendChild(usel);

      if (blk.issues && blk.issues.length) {
        card.appendChild(el('label', null, 'Which reported issue did this fix? (optional)'));
        var rsel = el('select', 'resolve-sel'); rsel.innerHTML = '<option value="">General repair / not from a report</option>';
        blk.issues.forEach(function (it) {
          var when = (it.date || '').slice(0, 10);
          var s = it.summary.length > 60 ? it.summary.slice(0, 57) + '…' : it.summary;
          var o = el('option', null, when + ' — ' + s); o.value = it.id; rsel.appendChild(o);
        });
        rsel.value = blk.resolveId || '';
        rsel.onchange = function () { blk.resolveId = rsel.value; };
        card.appendChild(rsel);
      }

      card.appendChild(el('label', 'req', 'Brief description of repair'));
      var ta = el('textarea'); ta.placeholder = 'e.g. Replaced the broken toilet cistern inlet valve.'; ta.value = blk.desc || '';
      ta.oninput = function () { blk.desc = ta.value; }; card.appendChild(ta);

      card.appendChild(el('label', null, 'Photos of the completed repair'));
      var photos = el('div', 'photos');
      blk.files.forEach(function (f, fi) {
        var t = el('div', 'thumb'); var im = el('img'); im.src = URL.createObjectURL(f); t.appendChild(im);
        var x = el('button', null, '×'); x.type = 'button'; x.onclick = function () { blk.files.splice(fi, 1); renderUnits(); };
        t.appendChild(x); photos.appendChild(t);
      });
      card.appendChild(photos);
      var btns = el('div', 'photo-btns'); var lb = el('label', 'pbtn', '📷 Add photos');
      var inp = el('input'); inp.type = 'file'; inp.accept = 'image/*'; inp.multiple = true;
      inp.onchange = function (e) { blk.files = blk.files.concat(Array.prototype.slice.call(e.target.files)); e.target.value = ''; renderUnits(); };
      lb.appendChild(inp); btns.appendChild(lb); card.appendChild(btns);

      wrap.appendChild(card);
    });
  }
  document.getElementById('addUnit').onclick = function () { units.push({ unitId: '', desc: '', files: [], resolveId: '', issues: null }); renderUnits(); };
  renderUnits();

  fetch('/public/forms/repair').then(function (r) { return r.json(); }).then(function (d) {
    PROPS = d.properties || [];
    renderUnits(); // the form always opens blank — just fill the unit dropdowns
  }).catch(function () {});

  var dateEl = document.getElementById('date');
  if (!dateEl.value) dateEl.value = new Date().toISOString().slice(0, 10);

  var payMethodEl = document.getElementById('paymethod');
  function syncPayFields() {
    var m = payMethodEl.value;
    document.getElementById('ewalletWrap').classList.toggle('hidden', m !== 'ewallet');
    document.getElementById('bankWrap').classList.toggle('hidden', m !== 'bank');
  }
  payMethodEl.addEventListener('change', syncPayFields);
  syncPayFields();

  function showErr(t) { var m = document.getElementById('msg'); m.className = 'msg err'; m.textContent = t; window.scrollTo(0, document.body.scrollHeight); }

  document.getElementById('form').onsubmit = function (e) {
    e.preventDefault();
    document.getElementById('msg').textContent = '';
    var name = document.getElementById('name').value.trim();
    var date = document.getElementById('date').value;
    var amount = document.getElementById('amount').value;
    var method = payMethodEl.value;
    var phone = document.getElementById('phone').value.trim();
    var bank = document.getElementById('bank').value.trim();
    if (!name) return showErr('Please enter your name.');
    var valid = units.filter(function (b) { return b.unitId && (b.desc || '').trim(); });
    if (!valid.length) return showErr('Please add at least one unit with a description of the repair.');
    if (amount === '' || isNaN(parseFloat(amount)) || parseFloat(amount) < 0) return showErr('Please enter the total amount to be paid.');
    if (method === 'ewallet' && !phone) return showErr('Please enter the e-wallet phone number for payment.');
    if (method === 'bank' && !bank) return showErr('Please enter your bank account details for payment.');

    var btn = document.getElementById('submit'); btn.disabled = true; btn.textContent = 'Sending…';
    var resolveIds = valid.map(function (b) { return b.resolveId; }).filter(Boolean);
    var unitsAns = valid.map(function (b) { return { unitId: b.unitId, unitLabel: unitLabel(b.unitId), desc: b.desc.trim(), resolveId: b.resolveId || null }; });
    var ans = { date: date, rp_amount: parseFloat(amount).toFixed(2), rp_pay_method: (method === 'ewallet' ? 'E-wallet' : 'Bank account'), units: unitsAns };
    if (method === 'ewallet') ans.rp_pay_phone = phone; else ans.rp_bank = bank;
    var payload = {
      type: 'repair', unitId: valid[0].unitId, submitterName: name,
      resolvesSubmissionId: resolveIds[0] || null, resolveIds: resolveIds, answers: ans
    };

    fetch('/public/forms', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload) })
      .then(function (r) { return r.json(); })
      .then(function (res) {
        if (!res || !res.id) throw new Error('submit failed');
        var failed = 0, jobs = [];
        valid.forEach(function (b, i) {
          (b.files || []).forEach(function (f) {
            jobs.push(prep(f, 1600, 0.82).then(function (p) {
              if (!p || !p.dataBase64) { failed++; return; }
              return fetch('/public/forms/' + res.id + '/photos', {
                method: 'POST', headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ fieldId: 'rp_photos__' + (i + 1), dataBase64: p.dataBase64, contentType: p.contentType, filename: f.name })
              }).then(function (r) { if (!r.ok) failed++; }, function () { failed++; });
            }));
          });
        });
        return Promise.all(jobs).then(function () { return failed; });
      })
      .then(function (failed) {
        if (failed) alert(failed + ' photo(s) could not be uploaded, but your report was saved. Please try again from Safari or Chrome (not an in-app browser).');
        document.getElementById('form').classList.add('hidden');
        document.getElementById('done').classList.remove('hidden');
        window.scrollTo(0, 0);
      })
      .catch(function () { showErr('Sorry, something went wrong. Please try again.'); btn.disabled = false; btn.textContent = 'Submit repair report'; });
  };
</script>
</body>
</html>
