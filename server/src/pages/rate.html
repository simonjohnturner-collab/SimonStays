<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Rate your stay · SimonStays</title>
<style>
  :root { --green:#1a7a3a; --green-d:#14622f; --ink:#1f2430; --muted:#6b7280; --line:#e3e6ea; --bg:#f4f6f4; }
  * { box-sizing:border-box; }
  html,body { margin:0; }
  body { font-family:-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif; color:var(--ink); background:var(--bg); line-height:1.5; }
  .wrap { max-width:520px; margin:0 auto; padding:16px; }
  .brand { font-size:22px; font-weight:800; color:var(--green); margin-bottom:12px; }
  .brand span { color:var(--ink); }
  .card { background:#fff; border:1px solid var(--line); border-radius:12px; padding:16px; }
  h1 { font-size:20px; margin:0 0 2px; }
  .muted { color:var(--muted); font-size:14px; }
  fieldset { border:0; padding:0; margin:18px 0 0; }
  legend { padding:0; font-weight:600; }
  .stars { display:flex; flex-direction:row-reverse; justify-content:flex-end; gap:2px; }
  .stars input { position:absolute; opacity:0; width:0; height:0; }
  .stars label { padding:2px 4px; font-size:34px; line-height:1; color:#cfd4da; cursor:pointer; }
  .stars input:checked ~ label, .stars label:hover, .stars label:hover ~ label { color:#e2a100; }
  .stars input:focus-visible + label { outline:2px solid var(--green); border-radius:4px; }
  button { margin-top:20px; width:100%; padding:12px; font:inherit; font-weight:600; color:#fff; background:var(--green); border:0; border-radius:10px; cursor:pointer; }
  button:hover { background:var(--green-d); }
  button:disabled { opacity:.6; cursor:default; }
  .err { color:#b3261e; font-size:14px; margin-top:8px; }
</style>
</head>
<body>
<main class="wrap">
  <div class="brand">Simon<span>Stays</span></div>
  <div class="card" id="app"><p class="muted">Loading…</p></div>
</main>
<script>
(function(){
  var api = '/public/rate/' + encodeURIComponent(location.pathname.split('/').pop());
  var app = document.getElementById('app');
  function el(tag, cls, text){ var e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; }
  function day(d){ return new Date(d + 'T00:00:00').toLocaleDateString('en-ZA', { day:'numeric', month:'short', year:'numeric' }); }
  function done(title, text){ app.textContent = ''; app.appendChild(el('h1', null, title)); if (text) app.appendChild(el('p', 'muted', text)); }
  function show(d){
    if (d.rated) return done('Thank you!', 'You’ve already rated this stay.');
    if (d.blocked) return done('This stay can’t be rated', d.blocked);
    app.textContent = '';
    app.appendChild(el('h1', null, 'How was your stay?'));
    app.appendChild(el('div', 'muted', d.place + ', ' + day(d.checkIn) + ' to ' + day(d.checkOut)));
    var f = el('form');
    d.categories.forEach(function(c){
      var fs = el('fieldset'); fs.appendChild(el('legend', null, c.label));
      var s = el('div', 'stars');
      // Highest first: the page lights up a star and those after it, and it's reversed on screen.
      for (var n = 5; n >= 1; n--) {
        var id = c.key + n, i = el('input'), l = el('label', null, '★');
        i.type = 'radio'; i.name = c.key; i.value = n; i.id = id; i.required = true;
        l.htmlFor = id; l.title = n + (n === 1 ? ' star' : ' stars'); l.setAttribute('aria-label', n + (n === 1 ? ' star' : ' stars'));
        s.appendChild(i); s.appendChild(l);
      }
      fs.appendChild(s); f.appendChild(fs);
    });
    var cl = el('label', 'comment-l', 'Tell us more (optional)'), ta = el('textarea');
    ta.rows = 4; ta.maxLength = 1000; ta.placeholder = 'What did you love? Anything the host could do better?';
    ta.style.cssText = 'width:100%;font:inherit;padding:10px;border:1px solid #d6dbd8;border-radius:8px;margin:6px 0 14px;box-sizing:border-box';
    cl.style.cssText = 'display:block;font-weight:600;margin-top:6px';
    f.appendChild(cl); f.appendChild(ta);
    var b = el('button', null, 'Send my rating'), e = el('div', 'err');
    f.appendChild(b); f.appendChild(e); app.appendChild(f);
    f.onsubmit = async function(ev){
      ev.preventDefault();
      var scores = {};
      d.categories.forEach(function(c){ var x = f.querySelector('input[name="' + c.key + '"]:checked'); if (x) scores[c.key] = Number(x.value); });
      b.disabled = true; e.textContent = '';
      try {
        var r = await fetch(api, { method:'POST', headers:{ 'Content-Type':'application/json' }, body:JSON.stringify({ scores:scores, comment:ta.value }) });
        var o = await r.json();
        if (!r.ok) throw new Error(o.message || 'Could not save your rating.');
        done('Thank you!', 'Your rating has been saved, and it helps other guests choose.');
      } catch (x) { e.textContent = x.message || 'Could not save your rating. Please try again.'; b.disabled = false; }
    };
  }
  fetch(api).then(function(r){ return r.json().then(function(d){ if (!r.ok) throw new Error(d.message || 'This link isn’t valid.'); show(d); }); })
    .catch(function(x){ done('This link isn’t valid', x.message); });
})();
</script>
</body>
</html>
